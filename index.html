im Detail","common":"In jeder Datei gleich","close":"Schließen","back":"Alle Anleitungen","rules":"Regeln in jeder Datei","rulesList":["Jede Auswahl ist eine anklickbare Option","An jedem Gate ist Ihre Freigabe nötig","Code wird zuletzt geschrieben, erst nach \"Yes, start coding\"","Geheimnisse gehören nie in Chat oder Code","Jede Veröffentlichung braucht eine neue Bestätigung","Claude sagt \"Ich bin mir nicht sicher\", statt zu raten"],"footer":"Powered by FDE Automation Pakistan, Kamran Aziz","heroLead":"Diese Seite erklärt die Anweisungsdateien, die Claude vor jedem Projekt liest. Jede Datei ist ein vollständiges Regelwerk für eine Art von Arbeit: Websites, Web- und Mobile-Apps, KI-Agenten, Automatisierungen, Finanzarbeit und eigene KI-Modelle. Öffnen Sie eine Anleitung, um zu sehen, was die Datei tut, wann man sie nutzt und welche Schritte Claude von der ersten Frage bis zur Übergabe befolgt.","heroNote":"Sie funktioniert offline auf jedem Handy, Tablet und Computer, in sieben Sprachen.","openList":"Anweisungsliste","howRuns":"So läuft jedes Projekt","poweredBy":"Powered by FDE Automation Pakistan","owner":"Kamran Aziz Virk, Gründer & CEO","website":"Website","email":"E-Mail","github":"Auf GitHub ansehen","linkedin":"LinkedIn","location":"Faisalabad, Pakistan","contact":"Kontakt","allGuides":"Die neun Anweisungsdateien","home":"Start","kit":"Skill & Anleitungen","kitTitle":"Was möchten Sie öffnen?","kitSkill":"Skill","kitSkillD":"Funktionen, Download und Einrichtung","kitGuides":"Anweisungen","kitGuidesD":"Die neun Anleitungen","skillTitle":"FDE Automation Skill","skillLead":"Ein Claude-Skill, der unsere gesamte Arbeitsweise enthält. Sobald er in Claude hinzugefügt ist, müssen Sie keine Anweisungsdateien mehr anhängen. Beschreiben Sie das Projekt, und Claude öffnet nur die Regeln, die es braucht.","featTitle":"Was er tut","feats":["Deckt alle neun Arbeitsarten ab: Apps, Websites, einzelne Agenten, Agenten-Teams, Workflows, Social Media, bestehende Projekte, Finanzen und Ihr eigenes LLM","Wählt den passenden Ablauf aus Ihrer Beschreibung, oder Sie nennen ihn direkt","Liest nur, was das Projekt braucht, und bleibt dadurch schnell und fokussiert","Behält alle Regeln: Erklärungen auf Urdu, anklickbare Optionen, Freigabe-Gates und Code erst nach Freigabe","Speichert den Fortschritt in PROGRESS.md und DECISIONS.md, damit die Arbeit in einem neuen Chat weitergeht","Funktioniert in der Claude-App, in Claude Code und in der Claude API"],"download":"Skill herunterladen (.zip)","openClaude":"Claude öffnen","installTitle":"Zu Claude hinzufügen","install":["Laden Sie die Skill-Datei mit dem Button oben herunter.","Öffnen Sie in der Claude-App Customize und dann Skills.","Laden Sie fde-automation-skill.zip hoch und schalten Sie ihn ein. Code execution muss in den Einstellungen aktiv sein.","Starten Sie ein Projekt mit einer Beschreibung oder schreiben Sie: \"Use the FDE Automation Skill\"."],"codeTitle":"Claude Code","codeText":"Entpacken Sie die Datei und kopieren Sie den Ordner fde-automation-skill nach ~/.claude/skills/ für alle Projekte oder nach .claude/skills/ in einem Projekt.","insideTitle":"Was enthalten ist","insideCore":"Regeln, die immer gelten, und der Router","insideCommon":"Sicherheit, Datenschutz, Tests, Engineering, KI-Engineering und Vorlagen"},"common":{"start":[{"h":"Eine Datei anhängen","t":"Hängen Sie nur die Anweisungsdatei für diese Aufgabe an das Claude-Projekt oder den Chat an. Sie enthält alle Regeln, die Claude braucht."},{"h":"Begrüßung und Projekt","t":"Claude begrüßt Sie in einfachem Urdu und fragt, was gebaut werden soll. Haben Sie es schon gesagt, bestätigt Claude nur."},{"h":"Projektdateien","t":"Ein altes Projekt fortsetzen? Hängen Sie PROGRESS.md, DECISIONS.md und PROJECT_BRIEF.md an. Claude fasst den Stand zusammen und macht dort weiter."},{"h":"Modus wählen","t":"Express-Modus für kleine Aufgaben mit geringem Risiko und kürzeren Schritten. Voll-Modus für größere Arbeit mit Geld, Anrufen, personenbezogenen Daten oder vielen Nutzern."},{"h":"Einstiegsfragen","t":"Jeweils eine anklickbare Frage: Region des Kunden, Grad der Autonomie, Sprachen, Sensibilität der Daten, vorhandene Systeme, Umfang und Budget."},{"h":"Technik und Sprachen","t":"Claude empfiehlt ein Set aus Programmiersprachen und Werkzeugen, kostenlose zuerst. Bezahlte Werkzeuge werden nur mit anklickbaren Optionen vorgeschlagen, und Claude kauft nie etwas."},{"h":"Plan freigeben","t":"Claude zeigt die Phasen, die Freigabe-Gates und die übersprungenen Phasen. Die Arbeit beginnt erst, wenn Sie auf Approved klicken."}],"end":[{"h":"Coding-Gate","t":"Vor jedem Programmcode fragt Claude: \"Sollen wir mit dem Programmieren beginnen?\" Nur ein klares \"Yes, start coding\" zählt."},{"h":"Bauen und testen","t":"Ein Modul nach dem anderen. Jedes Modul wird erklärt, gebaut, getestet und freigegeben, bevor das nächste beginnt."},{"h":"Prüfung und Sicherheit","t":"Checklisten für Code, Sicherheit und Compliance werden durchlaufen. Jedes gefundene Problem wird behoben und erneut getestet."},{"h":"Übergabe","t":"README, CLAUDE.md, Betriebshandbuch, Support-Bedingungen und ein Rollback-Plan werden übergeben. Der Fortschritt wird an jedem Gate gespeichert."}]},"guides":{"APPS":{"title":"Web-App und Mobile App","purpose":"Baut Webanwendungen (Login, Dashboards, Kundenportale) und Mobile Apps für Android, iOS oder beide.","when":"Wenn Sie eine App mit Nutzern, Bildschirmen und Daten brauchen.","attach":"INSTRUCTION-APPS.md. Bei Zahlungen zusätzlich INSTRUCTION-FINANCE.md. Mit KI-Chat zusätzlich INSTRUCTION-SINGLE-AGENT.md.","steps":[{"h":"Rollen und Rechte","t":"Eine Tabelle der Nutzertypen: was jeder sehen und ändern darf. Standardmäßig minimale Rechte."},{"h":"Bildschirme und Ablauf","t":"Die wichtigsten Bildschirme als Vorschau, mit zwei oder drei Varianten für den Startbildschirm. Sie wählen."},{"h":"Login und Sicherheit","t":"Sie geben die Login-Methode frei. Passwörter werden gehasht, Sitzungen laufen ab, und jede geschützte Aktion wird auf dem Server geprüft."},{"h":"Datenmodell","t":"Tabellen und Datenfluss werden einfach erklärt. Änderungen nur über Migrationen, mit Backup-Plan."},{"h":"API-Design","t":"Eine versionierte API, beschrieben in OpenAPI, mit Eingabeprüfung und Ratenbegrenzung."},{"h":"Funktion für Funktion","t":"Nur Pflichtfunktionen im ersten Release, jede in eigenem Branch und getestet."},{"h":"Store-Veröffentlichung","t":"Berechtigungen, Datenschutzangaben, sicher verwahrte Signaturschlüssel, interner Test, Beta, dann Store-Release."}]},"WEBSITE":{"title":"Website","purpose":"Baut Firmenwebsites, Landingpages, Portfolios, Blogs und Onlineshops.","when":"Wenn Sie eine öffentliche Website brauchen.","attach":"INSTRUCTION-WEBSITE.md. Für einen Onlineshop mit Zahlungen zusätzlich INSTRUCTION-FINANCE.md.","steps":[{"h":"Seiten und Inhalte","t":"Eine Sitemap und eine Inhaltsliste pro Seite: Titel, Text, Button und Bildbeschreibungen."},{"h":"Design-Optionen","t":"Zwei oder drei Designvorschauen, Mobile First. Sie wählen eine. Nur Bilder, an denen Sie die Rechte haben."},{"h":"Formulare und Datenschutz","t":"Formulare werden auf dem Server geprüft, vor Spam geschützt und sagen klar, welche Daten warum erhoben werden."},{"h":"Onlineshop","t":"Nur wenn Sie verkaufen. Preise kommen von Ihnen, die Zahlung läuft über den Checkout des Anbieters, Kartennummern werden nie gespeichert."},{"h":"Tempo, Zugang und SEO","t":"Barrierefreiheit nach WCAG 2.2 AA, Core-Web-Vitals-Ziele, Seitentitel, Sitemap und Unterstützung für Rechts-nach-links-Sprachen."},{"h":"Hosting und Start","t":"Domain und Hosting auf den Namen des Kunden, Prüfung vor dem Start und eine neue Bestätigung vor der Veröffentlichung."}]},"SINGLE-AGENT":{"title":"Einzelner Automatisierungs-Agent","purpose":"Baut einen KI-Agenten für Chat, Support, Buchungen, Lead-Qualifizierung, Erinnerungen oder Telefonate.","when":"Wenn ein Agent mit wenigen Werkzeugen die Aufgabe erledigen kann.","attach":"INSTRUCTION-SINGLE-AGENT.md. Für WhatsApp oder soziale Kanäle zusätzlich INSTRUCTION-SOCIAL-MEDIA.md. Bei Geld zusätzlich INSTRUCTION-FINANCE.md.","steps":[{"h":"Verhaltensvorgaben","t":"Was der Agent darf, was er nie tun darf, wann er an einen Menschen übergibt und seine Ausweichnachricht."},{"h":"Wissensquellen","t":"Nur freigegebene Daten wie FAQs, Preise und Richtlinien. Fehlt die Antwort, übergibt der Agent."},{"h":"Prompt-Design","t":"Versionierte Prompts auf Englisch mit Ton, Sprachen, Grenzen, KI-Kennzeichnung und Schutz vor Injection."},{"h":"Werkzeuge und Grenzen","t":"Eine freigegebene Werkzeugliste, minimale Rechte, ein Schrittlimit, ein tägliches Kostenlimit und ein Notschalter."},{"h":"Sprachanrufe","t":"Nur für Telefon-Agenten: Gesprächsablauf, KI-Hinweis, Anrufregeln, Stimmwahl und Tests mit Akzenten und Lärm."},{"h":"Tests und Red Teaming","t":"Ein Testset mit Urdu, Roman-Urdu, unhöflichen Nutzern und Fangfragen, bewertet vor jedem Gate."},{"h":"Pilot und Start","t":"Zuerst Testkonto, dann ein kleiner Pilot unter menschlicher Aufsicht, danach eine tägliche Übersicht über Chats, Übergaben und Kosten."}]},"MULTI-AGENT":{"title":"Multi-Agenten-System","purpose":"Baut ein Team von KI-Agenten mit klaren Rollen, die sich Arbeit übergeben.","when":"Wenn ein Agent nicht reicht und die Arbeit mehrere getrennte Rollen hat.","attach":"INSTRUCTION-MULTI-AGENT.md. Bei Kanälen oder Geld zusätzlich INSTRUCTION-SOCIAL-MEDIA.md oder INSTRUCTION-FINANCE.md.","steps":[{"h":"Braucht es ein Team?","t":"Claude prüft zuerst, ob ein einzelner Agent reicht. Mehr Agenten bedeuten mehr Kosten und mehr Fehlerquellen."},{"h":"Agentenkarte","t":"Rolle, Eingaben, Ausgaben und Werkzeuge jedes Agenten, als Diagramm zur Freigabe."},{"h":"Orchestrierung","t":"Wer beginnt, wie Arbeit in einem festen Nachrichtenformat übergeben wird und wo ein Mensch eingreift."},{"h":"Gedächtnis und Zustand","t":"Was jeder Agent lesen und schreiben darf, ein Eigentümer pro Datenelement und gespeicherter Aufgabenstatus zur Wiederherstellung."},{"h":"Fehler und Grenzen","t":"Wiederholungen, Ausweichlösungen, Schritt- und Kostenlimits pro Agent, keine Endlosschleifen und ein Notschalter für das ganze Team."},{"h":"Bau-Reihenfolge","t":"Erst Werkzeuge, dann einzelne Agenten, dann Paare, dann das ganze Team, jeweils einzeln getestet."},{"h":"Team-Bewertung","t":"End-to-End-Tests, Nachverfolgung jedes Schritts und Injection-Tests über die ganze Kette."}]},"WORKFLOW":{"title":"Workflow-Automatisierung","purpose":"Verbindet Apps und Daten, um Handarbeit zu ersetzen, einschließlich E-Mail- und Abteilungsautomatisierung.","when":"Wenn eine wiederkehrende manuelle Aufgabe von selbst laufen soll.","attach":"INSTRUCTION-WORKFLOW.md. Bei Geld zusätzlich INSTRUCTION-FINANCE.md.","steps":[{"h":"Prozesskarte","t":"Der heutige manuelle Prozess und der automatisierte, mit Erfolgskennzahlen wie gesparter Zeit und Fehlerquote."},{"h":"Auslöser und Schritte","t":"Was den Ablauf startet und jede Aktion der Reihe nach, mit den Daten, die sie liest und schreibt."},{"h":"Fehler und Duplikate","t":"Bei Fehlern wiederholen, melden oder stoppen. Ein wiederholter Auslöser erzeugt nie doppelte Datensätze oder Nachrichten."},{"h":"E-Mail-Automatisierung","t":"Sortierregeln, Antwortentwürfe, Nachfassen mit Stopp bei Antwort, SPF, DKIM, DMARC und kein Öffnen von Links in E-Mails."},{"h":"Abteilungs-Pilot","t":"Zuerst ein Prozess in einer Abteilung unter menschlicher Aufsicht, dann Ausweitung."},{"h":"Testkopie und Versionen","t":"In einer Testkopie bauen, jeden freigegebenen Ablauf nach Git exportieren und für jeden Ablauf einen Verantwortlichen benennen."}]},"SOCIAL-MEDIA":{"title":"Social-Media-Automatisierung","purpose":"Automatisiert WhatsApp, Instagram, Facebook, LinkedIn und ähnliche Plattformen nur über offizielle Werkzeuge.","when":"Wenn Sie automatische Antworten auf Nachrichten und Kommentare, Lead-Erfassung oder Updates wollen.","attach":"INSTRUCTION-SOCIAL-MEDIA.md. Für den antwortenden Agenten zusätzlich INSTRUCTION-SINGLE-AGENT.md oder INSTRUCTION-MULTI-AGENT.md.","steps":[{"h":"Plattformen und Funktionen","t":"Sie wählen Plattformen und Funktionen: Antworten, Kommentare, Leads, FAQs, Updates oder geplante Beiträge."},{"h":"Offizielle Konten","t":"Offizielle Business-Konten mit Admin-Zugang und nur den nötigen Berechtigungen. Keine Scraper und keine Fake-Konten."},{"h":"Einwilligung und Abmeldung","t":"Werbenachrichten nur an Personen mit Einwilligung. Eine Abmeldung wirkt sofort und wird protokolliert."},{"h":"Webhook-Sicherheit","t":"Jede eingehende Nachricht wird geprüft, nur einmal verarbeitet und als nicht vertrauenswürdiger Text behandelt."},{"h":"Plattformregeln","t":"WhatsApp-Vorlagen werden zuerst genehmigt. Automatisierung auf LinkedIn ist eingeschränkt. Sie bestätigen die aktuelle Richtlinie jeder Plattform."},{"h":"Erst testen, dann live","t":"Zuerst Testkonto, dann Pilot, dann eine neue Bestätigung für jeden Live-Kanal."}]},"GITHUB-AMEND":{"title":"Bestehendes Projekt überarbeiten","purpose":"Prüft ein bestehendes Projekt (GitHub, Kundenordner oder ZIP), findet Fehler, behebt sie und ergänzt fehlende Teile.","when":"Wenn Sie ein unfertiges oder fehlerhaftes Projekt zum Prüfen, Reparieren und Fertigstellen erhalten.","attach":"INSTRUCTION-GITHUB-AMEND.md. Wenn große neue Teile gebaut werden müssen, zusätzlich die Datei für diese Art von Arbeit (zum Beispiel APPS oder SINGLE-AGENT).","steps":[{"h":"Empfangen und sichten","t":"Claude listet die Dateien auf und liest README, Lizenz und Einstellungen. Noch wird nichts ausgeführt."},{"h":"Erlaubnis und Lizenz","t":"Dürfen Sie es ändern? Die Lizenz wird erklärt, und die Nennung des ursprünglichen Autors bleibt erhalten."},{"h":"Audit ohne Änderungen","t":"Ein Bericht über Fehler, Sicherheit, Datenschutz, Tempo, Tests und Dokumentation, jeweils mit Datei, Schweregrad und Wirkung."},{"h":"Auswahl der Korrekturen","t":"Sie haken die zu bearbeitenden Befunde an, nach Schweregrad gruppiert."},{"h":"Änderungsplan","t":"Korrekturen, Ergänzungen und Löschungen, eins nach dem anderen, jeweils mit eigener anklickbarer Freigabe."},{"h":"Umsetzung im neuen Branch","t":"Nie auf main. Ein Commit pro Änderung, vorhandene Tests laufen, und die Historie wird nach Geheimnissen durchsucht."},{"h":"Vorsichtig veröffentlichen","t":"Datenschutz- und Geheimnis-Prüfung, Nennung des Originals und Ihre Fußzeile sowie jedes Mal eine neue Bestätigung."}]},"FINANCE":{"title":"Finanzautomatisierung","purpose":"Automatisiert Rechnungen, Zahlungserinnerungen, Abgleiche, Spesenabrechnungen und Berichte mit strengen Kontrollen.","when":"Wenn eine Arbeit Geld oder Finanzunterlagen berührt.","attach":"INSTRUCTION-FINANCE.md, allein oder zusammen mit der Datei der Hauptaufgabe.","steps":[{"h":"Zuerst nur lesen","t":"Der Zugang beginnt schreibgeschützt. Jedes Schreibrecht braucht eine eigene Freigabe."},{"h":"Prozesskarte","t":"Jeder Finanzschritt wird markiert: automatisiert, mit menschlicher Freigabe oder nur durch Menschen."},{"h":"Freigabematrix","t":"Betragsgrenzen und Freigebende, mit zwei Personen für Zahlungen und Änderungen von Bankdaten."},{"h":"Sicherer Umgang mit Geld","t":"Exakte Dezimalzahlen statt Gleitkommazahlen, ein Währungscode bei jedem Betrag und Schlüssel gegen Duplikate."},{"h":"Abgleich","t":"Zwei Quellen werden abgeglichen. Abweichungen gehen an einen Menschen und werden nie erzwungen."},{"h":"Sandbox-Tests","t":"Nur Testmodus, nie echte Zahlungen. Limit-Tests und Audit-Trail-Tests müssen bestehen."},{"h":"Sicherheitsprüfung","t":"Eine separate Sicherheitsprüfung vor jedem Schreibzugriff. Claude gibt keine Steuer- oder Buchhaltungsberatung."}]},"LLM":{"title":"Ihr eigenes LLM","purpose":"Baut ein KI-Modellprodukt unter Ihrer Marke: Basismodell wählen, mit Ihren Daten trainieren, betreiben, API und MCP anbieten und die Claude API anbinden.","when":"Wenn Sie einen eigenen Assistenten wie ChatGPT, Claude oder Gemini unter Ihrer Marke wollen.","attach":"INSTRUCTION-LLM.md. Für eine vollständige Chat-App mit Login und Bildschirmen zusätzlich INSTRUCTION-APPS.md.","steps":[{"h":"Ehrlicher Start","t":"Ein Modell wie ChatGPT von Grund auf kostet zig Millionen Dollar. Der praktische Weg ist, auf einem bestehenden Modell aufzubauen."},{"h":"Weg wählen","t":"A: Marke auf Claude API. B: offenes Modell auf eigenen Servern. C: B plus Training. D: hybrider Router. E: kleines Modell von Grund auf."},{"h":"Lizenzen und Bedingungen","t":"Lizenz des Basismodells, Anbieterbedingungen, Datenrechte, ein eigener Markenname und Kundenbedingungen, geprüft von einem Anwalt."},{"h":"Datenvorbereitung","t":"Saubere Daten ohne persönliche Angaben, geprüft auf Urdu und Roman-Urdu, aufgeteilt in Trainings- und Testdaten."},{"h":"Training","t":"Effiziente Methoden wie LoRA, ein GPU-Budget mit harter Ausgabengrenze und Aufzeichnung jedes Laufs."},{"h":"Bewertung","t":"Fairer Vergleich mit Claude auf denselben Tests, Red Teaming, gemessenes Tempo und Kosten sowie eine Model Card."},{"h":"Betrieb, API und MCP","t":"Inferenz-Server, Streaming, ein Schlüssel pro Kunde, Kontingente, OpenAPI-Dokumentation und sichere MCP-Verbindungen."},{"h":"Claude-Router","t":"Einfache oder private Anfragen an Ihr Modell, schwierige an Claude. Private Daten verlassen nie das System, im Code erzwungen."},{"h":"Übergabe an Kunden","t":"Wo es läuft, wem die Gewichte gehören, Service-Level und ein Plan für Nachtraining."}]}}},"fr":{"ui":{"title":"Guides des instructions Claude","subtitle":"Comment fonctionne chaque fichier d'instructions, étape par étape","guides":"Guides","language":"Langue","choose":"Choisir un guide","homeIntro":"Chaque fichier d'instructions est complet à lui seul. Joignez uniquement le fichier de votre tâche au projet ou à la conversation Claude. Ouvrez un guide ci-dessous pour voir ce qu'il fait et les étapes suivies par Claude.","purpose":"Ce qu'il fait","when":"Quand l'utiliser","attach":"Fichiers à joindre","flow":"Tout le parcours en un coup d'œil","steps":"Étapes en détail","common":"Identique dans chaque fichier","close":"Fermer","back":"Tous les guides","rules":"Règles présentes dans chaque fichier","rulesList":["Chaque choix est une option cliquable","Votre accord est requis à chaque étape de validation","Le code est écrit en dernier, seulement après \"Yes, start coding\"","Les secrets ne vont jamais dans la conversation ni dans le code","Chaque publication demande une nouvelle confirmation","Claude dit « je ne peux pas l'affirmer » au lieu de deviner"],"footer":"Powered by FDE Automation Pakistan, Kamran Aziz","heroLead":"Cette page explique les fichiers d'instructions que Claude lit avant tout projet. Chaque fichier est un règlement complet pour un type de travail : sites web, applications web et mobiles, agents IA, automatisations, travail financier et modèles d'IA privés. Ouvrez un guide pour voir ce que fait le fichier, quand l'utiliser et chaque étape suivie par Claude, de la première question à la remise finale.","heroNote":"Elle fonctionne hors ligne sur tout téléphone, tablette ou ordinateur, en sept langues.","openList":"Liste des instructions","howRuns":"Comment se déroule chaque projet","poweredBy":"Powered by FDE Automation Pakistan","owner":"Kamran Aziz Virk, fondateur et PDG","website":"Site web","email":"E-mail","github":"Voir sur GitHub","linkedin":"LinkedIn","location":"Faisalabad, Pakistan","contact":"Contact","allGuides":"Les neuf fichiers d'instructions","home":"Accueil","kit":"Skill et guides","kitTitle":"Que voulez-vous ouvrir ?","kitSkill":"Skill","kitSkillD":"Fonctions, téléchargement et installation","kitGuides":"Instructions","kitGuidesD":"Les neuf guides d'instructions","skillTitle":"FDE Automation Skill","skillLead":"Un skill Claude qui contient toute notre méthode de travail. Une fois ajouté à Claude, vous n'avez plus à joindre de fichiers d'instructions. Décrivez le projet, et Claude n'ouvre que les règles dont il a besoin.","featTitle":"Ce qu'il fait","feats":["Couvre les neuf types de travail : applications, sites, agent unique, équipes d'agents, flux de travail, réseaux sociaux, projets existants, finance et votre propre LLM","Choisit le bon parcours à partir de votre description, ou vous pouvez le nommer","Ne lit que ce dont le projet a besoin, pour rester rapide et ciblé","Garde toutes les règles : explications en ourdou, options cliquables, validations et code seulement après accord","Enregistre la progression dans PROGRESS.md et DECISIONS.md pour reprendre dans une nouvelle conversation","Fonctionne dans l'application Claude, Claude Code et l'API Claude"],"download":"Télécharger le skill (.zip)","openClaude":"Ouvrir Claude","installTitle":"L'ajouter à Claude","install":["Téléchargez le fichier du skill avec le bouton ci-dessus.","Dans l'application Claude, ouvrez Customize, puis Skills.","Importez fde-automation-skill.zip et activez-le. Code execution doit être activé dans vos réglages.","Lancez un projet en le décrivant, ou écrivez : « Use the FDE Automation Skill »."],"codeTitle":"Claude Code","codeText":"Décompressez le fichier et copiez le dossier fde-automation-skill dans ~/.claude/skills/ pour tous vos projets, ou dans .claude/skills/ d'un seul projet.","insideTitle":"Contenu","insideCore":"Les règles toujours valables et le routeur","insideCommon":"Sécurité, confidentialité, tests, ingénierie, ingénierie IA et modèles"},"common":{"start":[{"h":"Joindre un seul fichier","t":"Joignez uniquement le fichier d'instructions de cette tâche au projet ou à la conversation Claude. Il contient toutes les règles dont Claude a besoin."},{"h":"Accueil et projet","t":"Claude vous salue en ourdou simple et demande ce que nous construisons. Si vous l'avez déjà dit, Claude se contente de confirmer."},{"h":"Fichiers du projet","t":"Vous reprenez un ancien projet ? Joignez PROGRESS.md, DECISIONS.md et PROJECT_BRIEF.md. Claude résume où vous en étiez et reprend à partir de là."},{"h":"Choisir le mode","t":"Mode Express pour les petits travaux à faible risque, avec des étapes plus courtes. Mode Complet pour les travaux plus importants impliquant de l'argent, des appels, des données personnelles ou de nombreux utilisateurs."},{"h":"Questions de départ","t":"Une question cliquable à la fois : région du client, niveau d'autonomie, langues, sensibilité des données, systèmes existants, volume et budget."},{"h":"Technologie et langages","t":"Claude recommande un ensemble de langages et d'outils, gratuits d'abord. Un outil payant n'est proposé qu'avec des options cliquables, et Claude n'achète jamais rien."},{"h":"Valider le plan","t":"Claude présente les phases, les étapes de validation et les phases ignorées. Le travail ne commence qu'après votre clic sur Approved."}],"end":[{"h":"Validation du code","t":"Avant tout code, Claude demande : « Pouvons-nous commencer à coder ? » Seul un « Yes, start coding » clair est accepté."},{"h":"Construire et tester","t":"Un module à la fois. Chaque module est expliqué, construit, testé et validé avant de passer au suivant."},{"h":"Revue et sécurité","t":"Les listes de contrôle du code, de la sécurité et de la conformité sont appliquées. Chaque problème est corrigé et testé à nouveau."},{"h":"Remise","t":"README, CLAUDE.md, manuel d'exploitation, conditions de support et plan de retour arrière sont remis. La progression est enregistrée à chaque validation."}]},"guides":{"APPS":{"title":"Application web et mobile","purpose":"Construit des applications web (connexion, tableaux de bord, portails clients) et des applications mobiles pour Android, iOS ou les deux.","when":"Quand vous avez besoin d'une application avec des utilisateurs, des écrans et des données.","attach":"INSTRUCTION-APPS.md. Si l'application encaisse des paiements, ajoutez INSTRUCTION-FINANCE.md. Si elle a un chat IA, ajoutez INSTRUCTION-SINGLE-AGENT.md.","steps":[{"h":"Rôles et droits","t":"Un tableau des types d'utilisateurs : ce que chacun peut voir et modifier. Accès minimal par défaut."},{"h":"Écrans et parcours","t":"Les écrans principaux sont conçus en aperçu, avec deux ou trois options pour l'accueil. Vous choisissez."},{"h":"Connexion et sécurité","t":"Vous validez la méthode de connexion. Les mots de passe sont hachés, les sessions expirent et chaque action protégée est vérifiée sur le serveur."},{"h":"Modèle de données","t":"Les tables et les flux de données sont expliqués simplement. Les changements passent uniquement par des migrations, avec un plan de sauvegarde."},{"h":"Conception de l'API","t":"Une API versionnée décrite en OpenAPI, avec contrôle des entrées et limites de requêtes."},{"h":"Fonction par fonction","t":"Uniquement les fonctions indispensables dans la première version, chacune dans sa propre branche et testée."},{"h":"Publication en boutique","t":"Autorisations, informations de confidentialité, clés de signature protégées, test interne, bêta, puis publication."}]},"WEBSITE":{"title":"Site web","purpose":"Construit des sites d'entreprise, pages d'atterrissage, portfolios, blogs et boutiques en ligne.","when":"Quand vous avez besoin d'un site web public.","attach":"INSTRUCTION-WEBSITE.md. Pour une boutique avec paiements, ajoutez INSTRUCTION-FINANCE.md.","steps":[{"h":"Pages et contenu","t":"Un plan du site et une liste de contenu par page : titre, texte, bouton et description des images."},{"h":"Options de design","t":"Deux ou trois aperçus, pensés d'abord pour le mobile. Vous en choisissez un. Seulement des images dont vous avez les droits."},{"h":"Formulaires et confidentialité","t":"Les formulaires sont vérifiés sur le serveur, protégés contre le spam et indiquent clairement quelles données sont collectées et pourquoi."},{"h":"Boutique en ligne","t":"Seulement si vous vendez. Les prix viennent de vous, le paiement passe par la page du prestataire et les numéros de carte ne sont jamais stockés."},{"h":"Vitesse, accès et SEO","t":"Accessibilité WCAG 2.2 AA, objectifs Core Web Vitals, titres de page, plan du site et prise en charge de l'écriture de droite à gauche."},{"h":"Hébergement et lancement","t":"Domaine et hébergement au nom du client, vérification avant lancement et nouvelle confirmation avant publication."}]},"SINGLE-AGENT":{"title":"Agent d'automatisation unique","purpose":"Construit un agent IA pour le chat, le support, les réservations, la qualification de prospects, les rappels ou les appels téléphoniques.","when":"Quand un seul agent avec quelques outils suffit.","attach":"INSTRUCTION-SINGLE-AGENT.md. Pour WhatsApp ou les réseaux sociaux, ajoutez INSTRUCTION-SOCIAL-MEDIA.md. Pour l'argent, ajoutez INSTRUCTION-FINANCE.md.","steps":[{"h":"Comportement attendu","t":"Ce que l'agent peut faire, ce qu'il ne doit jamais faire, quand il passe la main à un humain et son message de repli."},{"h":"Sources de connaissance","t":"Uniquement des données validées comme FAQ, prix et politiques. Si la réponse n'y est pas, l'agent passe la main."},{"h":"Conception des prompts","t":"Prompts versionnés en anglais avec ton, langues, limites, mention d'IA et protection contre l'injection."},{"h":"Outils et limites","t":"Une liste d'outils validée, un accès minimal, une limite d'étapes, un plafond de coût quotidien et un bouton d'arrêt."},{"h":"Appels vocaux","t":"Pour les agents téléphoniques seulement : déroulé d'appel, mention d'IA, règles d'appel, choix de la voix et tests avec accents et bruit."},{"h":"Tests et red teaming","t":"Un jeu de tests avec ourdou, ourdou romanisé, utilisateurs impolis et questions pièges, noté avant chaque validation."},{"h":"Pilote et lancement","t":"Compte de test d'abord, puis un petit pilote surveillé par un humain, puis un résumé quotidien des conversations, transferts et coûts."}]},"MULTI-AGENT":{"title":"Système multi-agents","purpose":"Construit une équipe d'agents IA aux rôles clairs qui se transmettent le travail.","when":"Quand un seul agent ne suffit pas et que le travail comporte plusieurs rôles distincts.","attach":"INSTRUCTION-MULTI-AGENT.md. Ajoutez INSTRUCTION-SOCIAL-MEDIA.md ou INSTRUCTION-FINANCE.md s'il y a des canaux ou de l'argent.","steps":[{"h":"Faut-il une équipe ?","t":"Claude vérifie d'abord si un seul agent suffit. Plus d'agents signifie plus de coûts et plus de points de défaillance."},{"h":"Carte des agents","t":"Rôle, entrées, sorties et outils de chaque agent, présentés en schéma pour votre validation."},{"h":"Orchestration","t":"Qui commence, comment le travail est transmis dans un format de message fixe et où intervient un humain."},{"h":"Mémoire et état","t":"Ce que chaque agent peut lire et écrire, un seul propriétaire par donnée et un état de tâche sauvegardé pour la reprise."},{"h":"Pannes et limites","t":"Nouvelles tentatives, solutions de repli, limites d'étapes et de coût par agent, pas de boucle infinie et un bouton d'arrêt pour toute l'équipe."},{"h":"Ordre de construction","t":"Les outils d'abord, puis les agents seuls, puis par paires, puis l'équipe complète, chacun testé séparément."},{"h":"Évaluation de l'équipe","t":"Tests de bout en bout, traçage de chaque étape et tests d'injection sur toute la chaîne."}]},"WORKFLOW":{"title":"Automatisation des flux de travail","purpose":"Relie applications et données pour supprimer le travail manuel, y compris l'automatisation des e-mails et des services.","when":"Quand une tâche manuelle répétitive doit fonctionner seule.","attach":"INSTRUCTION-WORKFLOW.md. S'il y a de l'argent, ajoutez INSTRUCTION-FINANCE.md.","steps":[{"h":"Carte du processus","t":"Le processus manuel actuel et le processus automatisé, avec des indicateurs de réussite comme le temps gagné et le taux d'erreur."},{"h":"Déclencheur et étapes","t":"Ce qui lance le flux et chaque action dans l'ordre, avec les données lues et écrites."},{"h":"Erreurs et doublons","t":"Nouvelle tentative, alerte ou arrêt en cas d'erreur. Un déclenchement répété ne crée jamais de doublons."},{"h":"Automatisation des e-mails","t":"Règles de tri, brouillons de réponse, relances qui s'arrêtent à la réponse, SPF, DKIM, DMARC et aucun lien d'e-mail ouvert."},{"h":"Pilote dans un service","t":"D'abord un processus dans un service, sous supervision humaine, puis extension."},{"h":"Copie de test et versions","t":"Construire dans une copie de test, exporter chaque flux validé vers Git et désigner un responsable pour chaque flux."}]},"SOCIAL-MEDIA":{"title":"Automatisation des réseaux sociaux","purpose":"Automatise WhatsApp, Instagram, Facebook, LinkedIn et plateformes similaires uniquement avec des outils officiels.","when":"Quand vous voulez des réponses aux messages et commentaires, la collecte de prospects ou des mises à jour.","attach":"INSTRUCTION-SOCIAL-MEDIA.md. Pour l'agent qui répond, ajoutez INSTRUCTION-SINGLE-AGENT.md ou INSTRUCTION-MULTI-AGENT.md.","steps":[{"h":"Plateformes et fonctions","t":"Vous choisissez les plateformes et les fonctions : réponses, commentaires, prospects, FAQ, mises à jour ou publications programmées."},{"h":"Comptes officiels","t":"Comptes professionnels officiels avec accès administrateur et seulement les autorisations nécessaires. Pas d'aspirateurs de données ni de faux comptes."},{"h":"Consentement et désinscription","t":"Messages promotionnels uniquement aux personnes ayant accepté. La désinscription est immédiate et enregistrée."},{"h":"Sécurité des webhooks","t":"Chaque message entrant est vérifié, traité une seule fois et considéré comme un texte non fiable."},{"h":"Règles des plateformes","t":"Les modèles WhatsApp sont approuvés d'abord. L'automatisation sur LinkedIn est limitée. Vous confirmez la politique actuelle de chaque plateforme."},{"h":"Tester, puis lancer","t":"Compte de test d'abord, puis pilote, puis nouvelle confirmation pour chaque canal en production."}]},"GITHUB-AMEND":{"title":"Modifier un projet existant","purpose":"Vérifie un projet existant (GitHub, dossier client ou zip), trouve les défauts, les corrige et complète les parties manquantes.","when":"Quand vous recevez un projet incomplet ou défectueux à vérifier, corriger et terminer.","attach":"INSTRUCTION-GITHUB-AMEND.md. Si de grandes parties nouvelles doivent être construites, ajoutez le fichier de ce type de travail (par exemple APPS ou SINGLE-AGENT).","steps":[{"h":"Réception et inspection","t":"Claude liste les fichiers et lit le README, la licence et la configuration. Rien n'est encore exécuté."},{"h":"Autorisation et licence","t":"Avez-vous le droit de le modifier ? La licence est expliquée et la mention de l'auteur d'origine est conservée."},{"h":"Audit sans modification","t":"Un rapport sur les bugs, la sécurité, la confidentialité, la vitesse, les tests et la documentation, avec fichier, gravité et effet."},{"h":"Choisir les corrections","t":"Vous cochez les points à traiter, regroupés par gravité."},{"h":"Plan de modification","t":"Corrections, ajouts et suppressions, un par un, chacun avec sa propre validation cliquable."},{"h":"Appliquer dans une branche","t":"Jamais sur main. Un commit par changement, tests existants exécutés et historique analysé à la recherche de secrets."},{"h":"Publier avec prudence","t":"Contrôle de confidentialité et des secrets, mention de l'original et votre pied de page, et nouvelle confirmation à chaque fois."}]},"FINANCE":{"title":"Automatisation financière","purpose":"Automatise factures, relances de paiement, rapprochements, notes de frais et rapports avec des contrôles stricts.","when":"Quand un travail touche à l'argent ou aux registres financiers.","attach":"INSTRUCTION-FINANCE.md, seul ou avec le fichier du travail principal.","steps":[{"h":"Lecture seule d'abord","t":"L'accès commence en lecture seule. Chaque droit d'écriture nécessite sa propre validation."},{"h":"Carte du processus","t":"Chaque étape financière est marquée : automatisée, validée par un humain ou réservée à un humain."},{"h":"Matrice de validation","t":"Plafonds de montants et validateurs, avec deux personnes pour les paiements et les changements de coordonnées bancaires."},{"h":"Gestion sûre de l'argent","t":"Décimaux exacts, jamais de nombres à virgule flottante, un code devise pour chaque montant et des clés anti-doublons."},{"h":"Rapprochement","t":"Deux sources sont comparées. Les écarts vont à un humain et ne sont jamais forcés."},{"h":"Tests en bac à sable","t":"Mode test uniquement, jamais de vrais paiements. Les tests de plafonds et de piste d'audit doivent réussir."},{"h":"Revue de sécurité","t":"Une revue de sécurité séparée avant tout accès en écriture. Claude ne donne pas de conseils fiscaux ou comptables."}]},"LLM":{"title":"Votre propre LLM","purpose":"Construit un produit de modèle d'IA à votre marque : choisir un modèle de base, l'entraîner sur vos données, l'héberger, offrir une API et MCP, et connecter l'API Claude.","when":"Quand vous voulez votre propre assistant comme ChatGPT, Claude ou Gemini sous votre marque.","attach":"INSTRUCTION-LLM.md. Pour une application de chat complète avec connexion et écrans, ajoutez INSTRUCTION-APPS.md.","steps":[{"h":"Départ honnête","t":"Un modèle comme ChatGPT créé de zéro coûte des dizaines de millions de dollars. La voie pratique consiste à partir d'un modèle existant."},{"h":"Choisir la voie","t":"A : votre marque sur l'API Claude. B : modèle ouvert sur vos serveurs. C : B plus entraînement. D : routeur hybride. E : petit modèle à partir de zéro."},{"h":"Licences et conditions","t":"Licence du modèle de base, conditions du fournisseur, droits sur les données, nom de marque original et conditions clients vérifiées par un avocat."},{"h":"Préparation des données","t":"Données propres sans informations personnelles, vérifiées en ourdou et ourdou romanisé, séparées en entraînement et test."},{"h":"Entraînement","t":"Méthodes efficaces comme LoRA, budget GPU avec plafond de dépense strict et enregistrement de chaque essai."},{"h":"Évaluation","t":"Comparaison équitable avec Claude sur les mêmes tests, red teaming, vitesse et coût mesurés, et fiche du modèle."},{"h":"Hébergement, API et MCP","t":"Serveur d'inférence, réponses en flux, une clé par client, quotas, documentation OpenAPI et connexions MCP sécurisées."},{"h":"Routeur Claude","t":"Les demandes simples ou privées vers votre modèle, les difficiles vers Claude. Les données privées ne sortent jamais, c'est imposé dans le code."},{"h":"Livraison au client","t":"Où il fonctionne, à qui appartiennent les poids, niveaux de service et plan de réentraînement."}]}}},"ru":{"ui":{"title":"Руководства по инструкциям Claude","subtitle":"Как работает каждый файл инструкций, шаг за шагом","guides":"Руководства","language":"Язык","choose":"Выберите руководство","homeIntro":"Каждый файл инструкций полностью самостоятелен. Прикрепите к проекту или чату Claude только файл для вашей задачи. Откройте руководство ниже, чтобы увидеть, что он делает и какие шаги выполняет Claude.","purpose":"Что он делает","when":"Когда использовать","attach":"Какие файлы прикрепить","flow":"Весь процесс одним взглядом","steps":"Шаги подробно","common":"Одинаково во всех файлах","close":"Закрыть","back":"Все руководства","rules":"Правила в каждом файле","rulesList":["Каждый выбор — это кнопка, на которую можно нажать","На каждом этапе проверки нужно ваше одобрение","Код пишется в последнюю очередь, только после \"Yes, start coding\"","Секреты никогда не попадают в чат или код","Каждая публикация требует нового подтверждения","Вместо догадок Claude говорит «я не могу сказать точно»"],"footer":"Powered by FDE Automation Pakistan, Kamran Aziz","heroLead":"Эта страница объясняет файлы инструкций, которые Claude читает перед началом любого проекта. Каждый файл — полный свод правил для одного вида работы: сайты, веб- и мобильные приложения, ИИ-агенты, автоматизация, финансовые задачи и собственные ИИ-модели. Откройте руководство, чтобы увидеть, что делает файл, когда его использовать и какие шаги выполняет Claude от первого вопроса до передачи проекта.","heroNote":"Работает без интернета на любом телефоне, планшете и компьютере, на семи языках.","openList":"Список инструкций","howRuns":"Как проходит каждый проект","poweredBy":"Powered by FDE Automation Pakistan","owner":"Камран Азиз Вирк, основатель и CEO","website":"Сайт","email":"Почта","github":"Открыть на GitHub","linkedin":"LinkedIn","location":"Фейсалабад, Пакистан","contact":"Контакты","allGuides":"Девять файлов инструкций","home":"Главная","kit":"Навык и руководства","kitTitle":"Что открыть?","kitSkill":"Навык","kitSkillD":"Возможности, загрузка и установка","kitGuides":"Инструкции","kitGuidesD":"Девять руководств по инструкциям","skillTitle":"FDE Automation Skill","skillLead":"Один навык Claude, в котором собран весь наш способ работы. После добавления в Claude больше не нужно прикреплять файлы инструкций. Опишите проект, и Claude откроет только нужные ему правила.","featTitle":"Что он делает","feats":["Охватывает девять видов работ: приложения, сайты, одного агента, команды агентов, процессы, соцсети, существующие проекты, финансы и собственную LLM","Сам выбирает нужный процесс по описанию, или вы называете его прямо","Читает только то, что нужно проекту, поэтому работает быстро и точно","Сохраняет все правила: объяснения на урду, варианты выбора, этапы одобрения и код только после согласия","Сохраняет прогресс в PROGRESS.md и DECISIONS.md, чтобы продолжить в новом чате","Работает в приложении Claude, Claude Code и Claude API"],"download":"Скачать навык (.zip)","openClaude":"Открыть Claude","installTitle":"Как добавить в Claude","install":["Скачайте файл навыка кнопкой выше.","В приложении Claude откройте Customize, затем Skills.","Загрузите fde-automation-skill.zip и включите его. В настройках должно быть включено выполнение кода (Code execution).","Начните проект с описания или напишите: «Use the FDE Automation Skill»."],"codeTitle":"Claude Code","codeText":"Распакуйте файл и скопируйте папку fde-automation-skill в ~/.claude/skills/ для всех проектов или в .claude/skills/ внутри одного проекта.","insideTitle":"Что внутри","insideCore":"Правила, действующие всегда, и маршрутизатор","insideCommon":"Безопасность, конфиденциальность, тесты, разработка, ИИ-инженерия и шаблоны"},"common":{"start":[{"h":"Прикрепите один файл","t":"Прикрепите к проекту или чату Claude только файл инструкций для этой задачи. В нём все правила, нужные Claude."},{"h":"Приветствие и проект","t":"Claude приветствует вас на простом урду и спрашивает, что мы создаём. Если вы уже сказали, Claude только подтверждает."},{"h":"Файлы проекта","t":"Продолжаете старый проект? Прикрепите PROGRESS.md, DECISIONS.md и PROJECT_BRIEF.md. Claude кратко опишет, где вы остановились, и продолжит оттуда."},{"h":"Выбор режима","t":"Быстрый режим (Express) для небольших задач с низким риском и короткими шагами. Полный режим (Full) для крупных работ с деньгами, звонками, персональными данными или множеством пользователей."},{"h":"Вводные вопросы","t":"По одному вопросу с вариантами: регион клиента, уровень самостоятельности, языки, чувствительность данных, текущие системы, объём и бюджет."},{"h":"Технологии и языки","t":"Claude предлагает набор языков программирования и инструментов, сначала бесплатных. Платный инструмент предлагается только с вариантами выбора, и Claude ничего не покупает."},{"h":"Утверждение плана","t":"Claude показывает этапы, точки одобрения и пропущенные этапы. Работа начинается только после нажатия Approved."}],"end":[{"h":"Разрешение на код","t":"Перед любым кодом Claude спрашивает: «Начинаем писать код?» Засчитывается только чёткое «Yes, start coding»."},{"h":"Разработка и тесты","t":"По одному модулю за раз. Каждый модуль объясняется, создаётся, тестируется и утверждается до начала следующего."},{"h":"Проверка и безопасность","t":"Проходят проверки кода, безопасности и соответствия требованиям. Каждая найденная проблема исправляется и проверяется снова."},{"h":"Передача","t":"Передаются README, CLAUDE.md, инструкция по эксплуатации, условия поддержки и план отката. Прогресс сохраняется на каждом этапе."}]},"guides":{"APPS":{"title":"Веб-приложение и мобильное приложение","purpose":"Создаёт веб-приложения (вход, панели, клиентские порталы) и мобильные приложения для Android, iOS или обеих платформ.","when":"Когда нужно приложение с пользователями, экранами и данными.","attach":"INSTRUCTION-APPS.md. Если в приложении есть оплата, добавьте INSTRUCTION-FINANCE.md. Если есть ИИ-чат, добавьте INSTRUCTION-SINGLE-AGENT.md.","steps":[{"h":"Роли и права","t":"Таблица типов пользователей: что каждый видит и может менять. По умолчанию минимальный доступ."},{"h":"Экраны и навигация","t":"Основные экраны создаются как макеты, с двумя-тремя вариантами главного экрана. Вы выбираете."},{"h":"Вход и безопасность","t":"Вы утверждаете способ входа. Пароли хешируются, сессии истекают, каждое защищённое действие проверяется на сервере."},{"h":"Модель данных","t":"Таблицы и потоки данных объясняются простым языком. Изменения только через миграции, с планом резервного копирования."},{"h":"Проектирование API","t":"API с версиями, описанный в OpenAPI, с проверкой входных данных и ограничением запросов."},{"h":"Функция за функцией","t":"В первом выпуске только обязательные функции, каждая в своей ветке и с тестами."},{"h":"Публикация в магазине","t":"Разрешения, сведения о конфиденциальности, надёжно хранимые ключи подписи, внутренний тест, бета, затем выпуск."}]},"WEBSITE":{"title":"Веб-сайт","purpose":"Создаёт сайты компаний, лендинги, портфолио, блоги и интернет-магазины.","when":"Когда нужен публичный сайт.","attach":"INSTRUCTION-WEBSITE.md. Для интернет-магазина с оплатой добавьте INSTRUCTION-FINANCE.md.","steps":[{"h":"Страницы и контент","t":"Карта сайта и список содержимого каждой страницы: заголовок, текст, кнопка и описания изображений."},{"h":"Варианты дизайна","t":"Два-три макета, сначала для мобильных. Вы выбираете один. Только изображения, на которые у вас есть права."},{"h":"Формы и конфиденциальность","t":"Формы проверяются на сервере, защищены от спама и ясно сообщают, какие данные собираются и зачем."},{"h":"Интернет-магазин","t":"Только если вы продаёте. Цены задаёте вы, оплата идёт через страницу платёжного сервиса, номера карт никогда не сохраняются."},{"h":"Скорость, доступность и SEO","t":"Доступность по WCAG 2.2 AA, цели Core Web Vitals, заголовки страниц, карта сайта и поддержка письма справа налево."},{"h":"Хостинг и запуск","t":"Домен и хостинг на имя клиента, проверка перед запуском и новое подтверждение перед публикацией."}]},"SINGLE-AGENT":{"title":"Один агент автоматизации","purpose":"Создаёт одного ИИ-агента для чата, поддержки, бронирования, квалификации клиентов, напоминаний или телефонных звонков.","when":"Когда с задачей справится один агент с несколькими инструментами.","attach":"INSTRUCTION-SINGLE-AGENT.md. Для WhatsApp или соцсетей добавьте INSTRUCTION-SOCIAL-MEDIA.md. Для денег добавьте INSTRUCTION-FINANCE.md.","steps":[{"h":"Описание поведения","t":"Что агенту можно, чего нельзя никогда, когда он передаёт разговор человеку и какое у него резервное сообщение."},{"h":"Источники знаний","t":"Только утверждённые данные: частые вопросы, цены, правила. Если ответа нет, агент передаёт разговор человеку."},{"h":"Разработка промптов","t":"Промпты с версиями на английском: тон, языки, ограничения, сообщение о том, что это ИИ, и защита от инъекций."},{"h":"Инструменты и лимиты","t":"Утверждённый список инструментов, минимальный доступ, лимит шагов, дневной лимит расходов и кнопка остановки."},{"h":"Голосовые звонки","t":"Только для телефонных агентов: сценарий звонка, сообщение об ИИ, правила звонков, выбор голоса, тесты с акцентами и шумом."},{"h":"Тесты и red teaming","t":"Набор тестов с урду, латинизированным урду, грубыми пользователями и каверзными вопросами, оценивается перед каждым этапом."},{"h":"Пилот и запуск","t":"Сначала тестовый аккаунт, затем небольшой пилот под присмотром человека, затем ежедневная сводка по чатам, передачам и расходам."}]},"MULTI-AGENT":{"title":"Многоагентная система","purpose":"Создаёт команду ИИ-агентов с чёткими ролями, которые передают работу друг другу.","when":"Когда одного агента недостаточно и в работе есть несколько отдельных ролей.","attach":"INSTRUCTION-MULTI-AGENT.md. Добавьте INSTRUCTION-SOCIAL-MEDIA.md или INSTRUCTION-FINANCE.md, если есть каналы или деньги.","steps":[{"h":"Нужна ли команда?","t":"Сначала Claude проверяет, справится ли один агент. Больше агентов — больше расходов и точек отказа."},{"h":"Карта агентов","t":"Роль, входы, выходы и инструменты каждого агента в виде схемы на ваше утверждение."},{"h":"Оркестрация","t":"Кто начинает, как работа передаётся в фиксированном формате сообщения и где подключается человек."},{"h":"Память и состояние","t":"Что каждый агент читает и пишет, один владелец у каждого элемента данных и сохранённое состояние задачи для восстановления."},{"h":"Сбои и лимиты","t":"Повторы, резервные варианты, лимиты шагов и расходов для каждого агента, без бесконечных циклов и одна кнопка остановки для всей команды."},{"h":"Порядок сборки","t":"Сначала инструменты, затем отдельные агенты, затем пары, затем вся команда, каждый этап с тестами."},{"h":"Оценка команды","t":"Сквозные тесты, трассировка каждого шага и тесты на инъекции по всей цепочке."}]},"WORKFLOW":{"title":"Автоматизация процессов","purpose":"Связывает приложения и данные, чтобы убрать ручную работу, включая автоматизацию почты и отделов.","when":"Когда повторяющаяся ручная задача должна выполняться сама.","attach":"INSTRUCTION-WORKFLOW.md. Если есть деньги, добавьте INSTRUCTION-FINANCE.md.","steps":[{"h":"Карта процесса","t":"Текущий ручной процесс и автоматизированный, с показателями успеха: сэкономленное время и доля ошибок."},{"h":"Запуск и шаги","t":"Что запускает процесс и каждое действие по порядку, с данными, которые оно читает и записывает."},{"h":"Ошибки и дубликаты","t":"При ошибке — повтор, уведомление или остановка. Повторный запуск никогда не создаёт дубликатов записей или сообщений."},{"h":"Автоматизация почты","t":"Правила сортировки, черновики ответов, напоминания с остановкой при ответе, SPF, DKIM, DMARC и никаких переходов по ссылкам из писем."},{"h":"Пилот в отделе","t":"Сначала один процесс в одном отделе под контролем человека, затем расширение."},{"h":"Тестовая копия и версии","t":"Сборка в тестовой копии, экспорт каждого утверждённого процесса в Git и ответственный за каждый процесс."}]},"SOCIAL-MEDIA":{"title":"Автоматизация соцсетей","purpose":"Автоматизирует WhatsApp, Instagram, Facebook, LinkedIn и похожие платформы только официальными инструментами.","when":"Когда нужны ответы на сообщения и комментарии, сбор заявок или рассылка новостей.","attach":"INSTRUCTION-SOCIAL-MEDIA.md. Для агента, который отвечает, добавьте INSTRUCTION-SINGLE-AGENT.md или INSTRUCTION-MULTI-AGENT.md.","steps":[{"h":"Платформы и функции","t":"Вы выбираете платформы и функции: ответы, комментарии, заявки, частые вопросы, новости или публикации по расписанию."},{"h":"Официальные аккаунты","t":"Официальные бизнес-аккаунты с доступом администратора и только нужными разрешениями. Никаких парсеров и фейковых аккаунтов."},{"h":"Согласие и отписка","t":"Рекламные сообщения только тем, кто дал согласие. Отписка срабатывает сразу и фиксируется."},{"h":"Безопасность вебхуков","t":"Каждое входящее сообщение проверяется, обрабатывается один раз и считается недоверенным текстом."},{"h":"Правила платформ","t":"Шаблоны WhatsApp сначала проходят одобрение. Автоматизация в LinkedIn ограничена. Вы подтверждаете действующие правила каждой платформы."},{"h":"Сначала тест, потом запуск","t":"Сначала тестовый аккаунт, затем пилот, затем новое подтверждение для каждого рабочего канала."}]},"GITHUB-AMEND":{"title":"Доработка существующего проекта","purpose":"Проверяет существующий проект (GitHub, папка клиента или архив), находит ошибки, исправляет их и дописывает недостающие части.","when":"Когда вы получили незавершённый или неисправный проект для проверки, исправления и завершения.","attach":"INSTRUCTION-GITHUB-AMEND.md. Если нужно создать крупные новые части, добавьте файл для этого типа работы (например APPS или SINGLE-AGENT).","steps":[{"h":"Получение и осмотр","t":"Claude перечисляет файлы и читает README, лицензию и настройки. Пока ничего не запускается."},{"h":"Разрешение и лицензия","t":"Есть ли у вас право изменять проект? Лицензия объясняется, упоминание исходного автора сохраняется."},{"h":"Аудит без изменений","t":"Отчёт об ошибках, безопасности, конфиденциальности, скорости, тестах и документации, с файлом, серьёзностью и последствиями."},{"h":"Выбор исправлений","t":"Вы отмечаете пункты для работы, сгруппированные по серьёзности."},{"h":"План доработки","t":"Исправления, добавления и удаления по одному, каждое со своим подтверждением нажатием."},{"h":"Работа в новой ветке","t":"Никогда в main. Один коммит на изменение, запуск существующих тестов и поиск секретов в истории."},{"h":"Осторожная публикация","t":"Проверка конфиденциальности и секретов, упоминание оригинала и ваш футер, и каждый раз новое подтверждение."}]},"FINANCE":{"title":"Финансовая автоматизация","purpose":"Автоматизирует счета, напоминания об оплате, сверку, авансовые отчёты и отчётность со строгим контролем.","when":"Когда работа затрагивает деньги или финансовые записи.","attach":"INSTRUCTION-FINANCE.md, отдельно или вместе с файлом основной работы.","steps":[{"h":"Сначала только чтение","t":"Доступ начинается только с чтения. Каждое право на запись требует отдельного одобрения."},{"h":"Карта процесса","t":"Каждый финансовый шаг помечается: автоматически, с одобрением человека или только человеком."},{"h":"Матрица одобрений","t":"Лимиты сумм и ответственные, два человека для платежей и изменения банковских реквизитов."},{"h":"Безопасная работа с деньгами","t":"Точные десятичные числа вместо чисел с плавающей точкой, код валюты у каждой суммы и ключи против дублей."},{"h":"Сверка","t":"Сверяются два источника. Расхождения передаются человеку и никогда не подгоняются."},{"h":"Тесты в песочнице","t":"Только тестовый режим, никаких реальных платежей. Тесты лимитов и журнала аудита обязательны."},{"h":"Проверка безопасности","t":"Отдельная проверка безопасности перед любым доступом на запись. Claude не даёт налоговых или бухгалтерских советов."}]},"LLM":{"title":"Собственная LLM","purpose":"Создаёт продукт на основе ИИ-модели под вашим брендом: выбор базовой модели, обучение на ваших данных, развёртывание, API и MCP, подключение Claude API.","when":"Когда нужен собственный ассистент вроде ChatGPT, Claude или Gemini под вашим брендом.","attach":"INSTRUCTION-LLM.md. Для полноценного чат-приложения со входом и экранами добавьте INSTRUCTION-APPS.md.","steps":[{"h":"Честное начало","t":"Модель уровня ChatGPT с нуля стоит десятки миллионов долларов. Практичный путь — строить на основе существующей модели."},{"h":"Выбор пути","t":"A: ваш бренд на Claude API. B: открытая модель на ваших серверах. C: B плюс обучение. D: гибридный маршрутизатор. E: маленькая модель с нуля."},{"h":"Лицензии и условия","t":"Лицензия базовой модели, условия провайдера, права на данные, оригинальное название бренда и условия для клиентов, проверенные юристом."},{"h":"Подготовка данных","t":"Чистые данные без персональной информации, проверенные на урду и латинизированном урду, разделённые на обучающие и тестовые."},{"h":"Обучение","t":"Эффективные методы вроде LoRA, бюджет на GPU с жёстким лимитом расходов и запись каждого запуска."},{"h":"Оценка","t":"Честное сравнение с Claude на тех же тестах, red teaming, замер скорости и стоимости и карточка модели."},{"h":"Сервер, API и MCP","t":"Сервер инференса, потоковые ответы, ключ для каждого клиента, квоты, документация OpenAPI и защищённые подключения MCP."},{"h":"Маршрутизатор Claude","t":"Простые или конфиденциальные запросы — вашей модели, сложные — Claude. Личные данные никогда не уходят наружу, это закреплено в коде."},{"h":"Передача клиенту","t":"Где работает модель, кому принадлежат веса, уровни обслуживания и план дообучения."}]}}},"it":{"ui":{"title":"Guide alle istruzioni di Claude","subtitle":"Come funziona ogni file di istruzioni, passo dopo passo","guides":"Guide","language":"Lingua","choose":"Scegli una guida","homeIntro":"Ogni file di istruzioni è completo da solo. Allega al progetto o alla chat di Claude solo il file per il tuo compito. Apri una guida qui sotto per vedere cosa fa e quali passaggi segue Claude.","purpose":"Cosa fa","when":"Quando usarlo","attach":"File da allegare","flow":"Tutto il percorso in un colpo d'occhio","steps":"Passaggi nel dettaglio","common":"Uguale in ogni file","close":"Chiudi","back":"Tutte le guide","rules":"Regole presenti in ogni file","rulesList":["Ogni scelta è un'opzione cliccabile","Serve la tua approvazione a ogni punto di controllo","Il codice si scrive per ultimo, solo dopo \"Yes, start coding\"","I segreti non vanno mai in chat o nel codice","Ogni pubblicazione richiede una nuova conferma","Claude dice «non posso esserne certo» invece di tirare a indovinare"],"footer":"Powered by FDE Automation Pakistan, Kamran Aziz","heroLead":"Questa pagina spiega i file di istruzioni che Claude legge prima di iniziare un progetto. Ogni file è un regolamento completo per un tipo di lavoro: siti web, app web e mobili, agenti IA, automazioni, lavoro finanziario e modelli di IA privati. Apri una guida per vedere cosa fa il file, quando usarlo e ogni passaggio che Claude segue, dalla prima domanda alla consegna finale.","heroNote":"Funziona offline su qualsiasi telefono, tablet o computer, in sette lingue.","openList":"Elenco istruzioni","howRuns":"Come si svolge ogni progetto","poweredBy":"Powered by FDE Automation Pakistan","owner":"Kamran Aziz Virk, fondatore e CEO","website":"Sito web","email":"Email","github":"Vedi su GitHub","linkedin":"LinkedIn","location":"Faisalabad, Pakistan","contact":"Contatti","allGuides":"I nove file di istruzioni","home":"Home","kit":"Skill e guide","kitTitle":"Cosa vuoi aprire?","kitSkill":"Skill","kitSkillD":"Funzioni, download e installazione","kitGuides":"Istruzioni","kitGuidesD":"Le nove guide alle istruzioni","skillTitle":"FDE Automation Skill","skillLead":"Uno skill di Claude che contiene tutto il nostro metodo di lavoro. Una volta aggiunto a Claude non serve più allegare i file di istruzioni. Descrivi il progetto e Claude apre solo le regole che servono.","featTitle":"Cosa fa","feats":["Copre tutti e nove i tipi di lavoro: app, siti, agente singolo, squadre di agenti, flussi, social media, progetti esistenti, finanza e il tuo LLM","Sceglie il percorso giusto dalla tua descrizione, oppure puoi indicarlo tu","Legge solo ciò che serve al progetto, così resta veloce e mirato","Mantiene tutte le regole: spiegazioni in urdu, opzioni cliccabili, punti di approvazione e codice solo dopo il via libera","Salva i progressi in PROGRESS.md e DECISIONS.md per riprendere in una nuova chat","Funziona nell'app Claude, in Claude Code e nell'API di Claude"],"download":"Scarica lo skill (.zip)","openClaude":"Apri Claude","installTitle":"Aggiungilo a Claude","install":["Scarica il file dello skill con il pulsante qui sopra.","Nell'app Claude apri Customize, poi Skills.","Carica fde-automation-skill.zip e attivalo. Code execution deve essere attivo nelle impostazioni.","Avvia un progetto descrivendolo, oppure scrivi: «Use the FDE Automation Skill»."],"codeTitle":"Claude Code","codeText":"Estrai il file e copia la cartella fde-automation-skill in ~/.claude/skills/ per tutti i progetti, oppure in .claude/skills/ di un singolo progetto.","insideTitle":"Cosa contiene","insideCore":"Le regole sempre valide e il router","insideCommon":"Sicurezza, privacy, test, ingegneria, ingegneria IA e modelli"},"common":{"start":[{"h":"Allega un solo file","t":"Allega al progetto o alla chat di Claude solo il file di istruzioni di questo compito. Contiene tutte le regole di cui Claude ha bisogno."},{"h":"Saluto e progetto","t":"Claude ti saluta in urdu semplice e chiede cosa costruiamo. Se l'hai già detto, Claude si limita a confermare."},{"h":"File del progetto","t":"Riprendi un vecchio progetto? Allega PROGRESS.md, DECISIONS.md e PROJECT_BRIEF.md. Claude riassume dove eri arrivato e riparte da lì."},{"h":"Scegli la modalità","t":"Modalità Express per lavori piccoli e a basso rischio, con passaggi più brevi. Modalità Completa per lavori più grandi con denaro, chiamate, dati personali o molti utenti."},{"h":"Domande iniziali","t":"Una domanda cliccabile alla volta: regione del cliente, livello di autonomia, lingue, sensibilità dei dati, sistemi esistenti, volumi e budget."},{"h":"Tecnologia e linguaggi","t":"Claude consiglia un insieme di linguaggi e strumenti, prima quelli gratuiti. Uno strumento a pagamento viene proposto solo con opzioni cliccabili, e Claude non acquista mai nulla."},{"h":"Approva il piano","t":"Claude mostra le fasi, i punti di approvazione e le fasi saltate. Il lavoro inizia solo dopo il tuo clic su Approved."}],"end":[{"h":"Via libera al codice","t":"Prima di qualsiasi codice Claude chiede: «Iniziamo a programmare?» Vale solo un chiaro «Yes, start coding»."},{"h":"Costruire e testare","t":"Un modulo alla volta. Ogni modulo viene spiegato, costruito, testato e approvato prima del successivo."},{"h":"Revisione e sicurezza","t":"Si applicano le liste di controllo per codice, sicurezza e conformità. Ogni problema viene corretto e testato di nuovo."},{"h":"Consegna","t":"Vengono consegnati README, CLAUDE.md, manuale operativo, condizioni di assistenza e piano di ripristino. I progressi si salvano a ogni approvazione."}]},"guides":{"APPS":{"title":"App web e app mobile","purpose":"Costruisce applicazioni web (accesso, dashboard, portali clienti) e app mobili per Android, iOS o entrambi.","when":"Quando ti serve un'app con utenti, schermate e dati.","attach":"INSTRUCTION-APPS.md. Se l'app gestisce pagamenti, aggiungi INSTRUCTION-FINANCE.md. Se ha una chat IA, aggiungi INSTRUCTION-SINGLE-AGENT.md.","steps":[{"h":"Ruoli e permessi","t":"Una tabella dei tipi di utente: cosa può vedere e modificare ciascuno. Accesso minimo come impostazione predefinita."},{"h":"Schermate e navigazione","t":"Le schermate principali vengono create come anteprime, con due o tre opzioni per la home. Scegli tu."},{"h":"Accesso e sicurezza","t":"Approvi tu il metodo di accesso. Le password sono cifrate, le sessioni scadono e ogni azione protetta è verificata sul server."},{"h":"Modello dei dati","t":"Tabelle e flussi di dati spiegati in modo semplice. Le modifiche passano solo tramite migrazioni, con un piano di backup."},{"h":"Progettazione API","t":"Un'API con versioni descritta in OpenAPI, con controllo degli input e limiti alle richieste."},{"h":"Funzione per funzione","t":"Solo le funzioni indispensabili nella prima versione, ognuna nel proprio branch e testata."},{"h":"Pubblicazione negli store","t":"Permessi, informazioni sulla privacy, chiavi di firma custodite al sicuro, test interno, beta, poi pubblicazione."}]},"WEBSITE":{"title":"Sito web","purpose":"Costruisce siti aziendali, landing page, portfolio, blog e negozi online.","when":"Quando ti serve un sito web pubblico.","attach":"INSTRUCTION-WEBSITE.md. Per un negozio online con pagamenti, aggiungi INSTRUCTION-FINANCE.md.","steps":[{"h":"Pagine e contenuti","t":"Una mappa del sito e un elenco dei contenuti per pagina: titolo, testo, pulsante e descrizione delle immagini."},{"h":"Opzioni di design","t":"Due o tre anteprime, pensate prima per il mobile. Ne scegli una. Solo immagini di cui hai i diritti."},{"h":"Moduli e privacy","t":"I moduli sono verificati sul server, protetti dallo spam e dicono chiaramente quali dati raccolgono e perché."},{"h":"Negozio online","t":"Solo se vendi. I prezzi li fornisci tu, il pagamento avviene sulla pagina del fornitore e i numeri di carta non vengono mai salvati."},{"h":"Velocità, accessibilità e SEO","t":"Accessibilità WCAG 2.2 AA, obiettivi Core Web Vitals, titoli delle pagine, mappa del sito e supporto alla scrittura da destra a sinistra."},{"h":"Hosting e lancio","t":"Dominio e hosting intestati al cliente, controllo prima del lancio e nuova conferma prima della pubblicazione."}]},"SINGLE-AGENT":{"title":"Agente di automazione singolo","purpose":"Costruisce un agente IA per chat, assistenza, prenotazioni, qualificazione dei contatti, promemoria o telefonate.","when":"Quando un solo agente con pochi strumenti basta per il lavoro.","attach":"INSTRUCTION-SINGLE-AGENT.md. Per WhatsApp o i social, aggiungi INSTRUCTION-SOCIAL-MEDIA.md. Per il denaro, aggiungi INSTRUCTION-FINANCE.md.","steps":[{"h":"Comportamento previsto","t":"Cosa può fare l'agente, cosa non deve mai fare, quando passa la conversazione a una persona e il suo messaggio di riserva."},{"h":"Fonti di conoscenza","t":"Solo dati approvati come FAQ, prezzi e regole. Se la risposta non c'è, l'agente passa a una persona."},{"h":"Progettazione dei prompt","t":"Prompt con versioni in inglese con tono, lingue, limiti, dichiarazione di essere un'IA e protezione dalle iniezioni."},{"h":"Strumenti e limiti","t":"Un elenco di strumenti approvato, accesso minimo, un limite di passaggi, un tetto di spesa giornaliero e un pulsante di arresto."},{"h":"Chiamate vocali","t":"Solo per agenti telefonici: flusso della chiamata, dichiarazione di IA, regole di chiamata, scelta della voce e test con accenti e rumore."},{"h":"Test e red teaming","t":"Un set di test con urdu, urdu romanizzato, utenti scortesi e domande trabocchetto, valutato prima di ogni approvazione."},{"h":"Pilota e avvio","t":"Prima un account di prova, poi un piccolo pilota sorvegliato da una persona, poi un riepilogo giornaliero di chat, passaggi e costi."}]},"MULTI-AGENT":{"title":"Sistema multi-agente","purpose":"Costruisce una squadra di agenti IA con ruoli chiari che si passano il lavoro.","when":"Quando un solo agente non basta e il lavoro ha più ruoli distinti.","attach":"INSTRUCTION-MULTI-AGENT.md. Aggiungi INSTRUCTION-SOCIAL-MEDIA.md o INSTRUCTION-FINANCE.md se ci sono canali o denaro.","steps":[{"h":"Serve una squadra?","t":"Claude verifica prima se basta un solo agente. Più agenti significano più costi e più punti di guasto."},{"h":"Mappa degli agenti","t":"Ruolo, input, output e strumenti di ogni agente, disegnati in uno schema per la tua approvazione."},{"h":"Orchestrazione","t":"Chi inizia, come si passa il lavoro con un formato di messaggio fisso e dove interviene una persona."},{"h":"Memoria e stato","t":"Cosa può leggere e scrivere ogni agente, un solo proprietario per ogni dato e uno stato del compito salvato per il ripristino."},{"h":"Guasti e limiti","t":"Nuovi tentativi, alternative, limiti di passaggi e di costo per agente, nessun ciclo infinito e un solo pulsante di arresto per tutta la squadra."},{"h":"Ordine di costruzione","t":"Prima gli strumenti, poi i singoli agenti, poi le coppie, poi la squadra intera, ognuno testato separatamente."},{"h":"Valutazione della squadra","t":"Test da inizio a fine, tracciamento di ogni passaggio e test di iniezione su tutta la catena."}]},"WORKFLOW":{"title":"Automazione dei flussi di lavoro","purpose":"Collega app e dati per eliminare il lavoro manuale, compresa l'automazione di email e reparti.","when":"Quando un'attività manuale ripetitiva deve funzionare da sola.","attach":"INSTRUCTION-WORKFLOW.md. Se c'è denaro, aggiungi INSTRUCTION-FINANCE.md.","steps":[{"h":"Mappa del processo","t":"Il processo manuale attuale e quello automatizzato, con misure di successo come tempo risparmiato e tasso di errore."},{"h":"Avvio e passaggi","t":"Cosa fa partire il flusso e ogni azione in ordine, con i dati che legge e scrive."},{"h":"Errori e duplicati","t":"Nuovo tentativo, avviso o arresto in caso di errore. Un avvio ripetuto non crea mai record o messaggi doppi."},{"h":"Automazione email","t":"Regole di smistamento, bozze di risposta, solleciti che si fermano alla risposta, SPF, DKIM, DMARC e nessun link delle email aperto."},{"h":"Pilota in un reparto","t":"Prima un processo in un reparto, con la supervisione di una persona, poi l'estensione."},{"h":"Copia di prova e versioni","t":"Costruire in una copia di prova, esportare in Git ogni flusso approvato e nominare un responsabile per ogni flusso."}]},"SOCIAL-MEDIA":{"title":"Automazione dei social media","purpose":"Automatizza WhatsApp, Instagram, Facebook, LinkedIn e piattaforme simili solo con strumenti ufficiali.","when":"Quando vuoi risposte a messaggi e commenti, raccolta di contatti o aggiornamenti.","attach":"INSTRUCTION-SOCIAL-MEDIA.md. Per l'agente che risponde, aggiungi INSTRUCTION-SINGLE-AGENT.md o INSTRUCTION-MULTI-AGENT.md.","steps":[{"h":"Piattaforme e funzioni","t":"Scegli piattaforme e funzioni: risposte, commenti, contatti, FAQ, aggiornamenti o post programmati."},{"h":"Account ufficiali","t":"Account aziendali ufficiali con accesso da amministratore e solo i permessi necessari. Niente scraper né account falsi."},{"h":"Consenso e disiscrizione","t":"Messaggi promozionali solo a chi ha acconsentito. La disiscrizione vale subito e viene registrata."},{"h":"Sicurezza dei webhook","t":"Ogni messaggio in arrivo viene verificato, gestito una sola volta e trattato come testo non affidabile."},{"h":"Regole delle piattaforme","t":"I modelli WhatsApp si approvano prima. L'automazione su LinkedIn è limitata. Confermi tu le regole attuali di ogni piattaforma."},{"h":"Prima test, poi live","t":"Prima un account di prova, poi un pilota, poi una nuova conferma per ogni canale reale."}]},"GITHUB-AMEND":{"title":"Modificare un progetto esistente","purpose":"Controlla un progetto esistente (GitHub, cartella del cliente o zip), trova i difetti, li corregge e completa le parti mancanti.","when":"Quando ricevi un progetto incompleto o difettoso da controllare, correggere e finire.","attach":"INSTRUCTION-GITHUB-AMEND.md. Se vanno costruite grandi parti nuove, aggiungi il file di quel tipo di lavoro (per esempio APPS o SINGLE-AGENT).","steps":[{"h":"Ricezione e ispezione","t":"Claude elenca i file e legge README, licenza e impostazioni. Per ora non si esegue nulla."},{"h":"Permesso e licenza","t":"Hai il diritto di modificarlo? La licenza viene spiegata e il credito all'autore originale resta."},{"h":"Verifica senza modifiche","t":"Un rapporto su bug, sicurezza, privacy, velocità, test e documentazione, con file, gravità ed effetto."},{"h":"Scegli cosa correggere","t":"Spunti i problemi su cui intervenire, raggruppati per gravità."},{"h":"Piano di modifica","t":"Correzioni, aggiunte ed eliminazioni, una alla volta, ognuna con la propria approvazione cliccabile."},{"h":"Applicare in un nuovo branch","t":"Mai su main. Un commit per modifica, test esistenti eseguiti e ricerca di segreti nella cronologia."},{"h":"Pubblicare con cautela","t":"Controllo di privacy e segreti, credito all'originale e il tuo piè di pagina, e ogni volta una nuova conferma."}]},"FINANCE":{"title":"Automazione finanziaria","purpose":"Automatizza fatture, solleciti di pagamento, riconciliazioni, note spese e report con controlli rigorosi.","when":"Quando un lavoro tocca denaro o registri finanziari.","attach":"INSTRUCTION-FINANCE.md, da solo o insieme al file del lavoro principale.","steps":[{"h":"Prima sola lettura","t":"L'accesso parte in sola lettura. Ogni permesso di scrittura richiede un'approvazione separata."},{"h":"Mappa del processo","t":"Ogni passaggio finanziario è segnato: automatico, approvato da una persona o solo manuale."},{"h":"Matrice di approvazione","t":"Limiti di importo e approvatori, con due persone per pagamenti e modifiche dei dati bancari."},{"h":"Gestione sicura del denaro","t":"Decimali esatti, mai numeri in virgola mobile, un codice valuta per ogni importo e chiavi contro i duplicati."},{"h":"Riconciliazione","t":"Due fonti vengono confrontate. Le differenze vanno a una persona e non vengono mai forzate."},{"h":"Test in ambiente di prova","t":"Solo modalità di test, mai pagamenti reali. I test dei limiti e del registro di controllo devono superarsi."},{"h":"Revisione di sicurezza","t":"Una revisione di sicurezza separata prima di ogni accesso in scrittura. Claude non dà consigli fiscali o contabili."}]},"LLM":{"title":"Il tuo LLM","purpose":"Costruisce un prodotto basato su un modello IA con il tuo marchio: scegliere un modello di base, addestrarlo sui tuoi dati, servirlo, offrire API e MCP e collegare l'API di Claude.","when":"Quando vuoi un tuo assistente come ChatGPT, Claude o Gemini con il tuo marchio.","attach":"INSTRUCTION-LLM.md. Per un'app di chat completa con accesso e schermate, aggiungi INSTRUCTION-APPS.md.","steps":[{"h":"Partenza onesta","t":"Un modello come ChatGPT creato da zero costa decine di milioni di dollari. La via pratica è costruire su un modello esistente."},{"h":"Scegli il percorso","t":"A: il tuo marchio sull'API di Claude. B: modello aperto sui tuoi server. C: B più addestramento. D: router ibrido. E: piccolo modello da zero."},{"h":"Licenze e condizioni","t":"Licenza del modello di base, condizioni del fornitore, diritti sui dati, un nome di marchio originale e condizioni per i clienti verificate da un avvocato."},{"h":"Preparazione dei dati","t":"Dati puliti senza informazioni personali, verificati in urdu e urdu romanizzato, divisi tra addestramento e test."},{"h":"Addestramento","t":"Metodi efficienti come LoRA, un budget GPU con limite di spesa rigido e registrazione di ogni prova."},{"h":"Valutazione","t":"Confronto equo con Claude sugli stessi test, red teaming, velocità e costi misurati e scheda del modello."},{"h":"Servizio, API e MCP","t":"Server di inferenza, risposte in streaming, una chiave per cliente, quote, documentazione OpenAPI e connessioni MCP sicure."},{"h":"Router Claude","t":"Richieste semplici o private al tuo modello, quelle difficili a Claude. I dati privati non escono mai, ed è imposto nel codice."},{"h":"Consegna al cliente","t":"Dove funziona, a chi appartengono i pesi, livelli di servizio e piano di riaddestramento."}]}}}}</script>
