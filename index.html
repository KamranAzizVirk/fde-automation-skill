button{font:inherit;color:inherit}
a{color:inherit}
.file{font-family:var(--mono);font-size:.84em;white-space:nowrap;direction:ltr;unicode-bidi:isolate;background:var(--teal-soft);color:var(--teal-ink);padding:0 .35em;border-radius:4px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding-inline:max(var(--pad),env(safe-area-inset-left)) max(var(--pad),env(safe-area-inset-right))}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.bar{display:flex;align-items:center;gap:10px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:start}
.mark{width:36px;height:36px;border-radius:8px;background:var(--teal);display:grid;place-items:center;font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.02em;color:#fff;flex:none}
.brand-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;cursor:pointer;white-space:nowrap;line-height:1}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.solid{background:var(--teal);border-color:var(--teal)}
.btn[aria-current=page]{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45)}
.bar .btn{justify-content:center;min-width:0}
.btn.solid:hover{filter:brightness(1.08)}
.btn .lbl{font-size:.95rem}
body.l-ur .btn .lbl{font-size:.92rem;line-height:2}

/* hero */
.hero{background:var(--ink);color:#E9EEF6;padding:clamp(28px,6vw,64px) 0 clamp(32px,6vw,72px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:start}
.hero h1{font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.12;margin:0 0 18px;font-weight:600;color:#fff;letter-spacing:-.01em;max-width:16ch}
body.l-ur .hero h1{line-height:1.9;letter-spacing:0;max-width:none}
body.l-ar .hero h1{line-height:1.5;letter-spacing:0}
.lead{font-size:clamp(1.02rem,1.6vw,1.16rem);color:#C9D3E2;margin:0 0 12px;max-width:62ch}
.note{color:#93A3BB;margin:0 0 26px;font-size:.95rem}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.ctas .btn{min-height:48px;padding:0 18px;font-weight:600}
.route{background:var(--ink2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px 22px 10px}
.route h2{margin:0 0 14px;font-size:1rem;font-weight:600;color:#fff}
.route ol{list-style:none;margin:0;padding:0;position:relative}
.route li{position:relative;padding-inline-start:34px;padding-bottom:16px;color:#D6DEEA}
.route li::before{content:"";position:absolute;inset-inline-start:7px;top:22px;bottom:-2px;width:2px;background:rgba(255,255,255,.16)}
.route li:last-child::before{display:none}
.route li::after{content:"";position:absolute;inset-inline-start:1px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--ink2);border:3px solid var(--teal)}
.route li.gate::after{border-color:var(--brass)}
body.l-ur .route li::after{top:14px}
body.l-ur .route li::before{top:30px}
.route b{display:block;font-weight:600;color:#fff;line-height:1.45}
body.l-ur .route b{line-height:2}

main{flex:1}
.section{padding:clamp(28px,5vw,56px) 0}
.section h2.t{font-size:clamp(1.3rem,2.4vw,1.7rem);margin:0 0 18px;font-weight:600;line-height:1.3}
body.l-ur .section h2.t{line-height:2}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:0;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.row{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:start;cursor:pointer;width:100%;color:inherit}
.index .row{border-inline-end:1px solid var(--rule)}
.row:hover{background:var(--teal-soft)}
.tile{width:44px;height:44px;border-radius:11px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;flex:none}
.tile svg.i{width:22px;height:22px}
.row h3{margin:0 0 2px;font-size:1.06rem;font-weight:600;line-height:1.45}
body.l-ur .row h3{line-height:2}
.row p{margin:0 0 6px;color:var(--muted);font-size:.93rem}
.row .file{font-size:.75rem}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;list-style:none;margin:0;padding:0}
.rules li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.rules svg.i{color:var(--teal);margin-top:3px}
body.l-ur .rules svg.i{margin-top:9px}
.contact{background:var(--card);border-top:1px solid var(--rule)}
.contact-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:28px;align-items:start}
.pb{font-size:1.25rem;font-weight:600;margin:0 0 4px;font-family:var(--sans);direction:ltr;unicode-bidi:isolate;display:block}
[dir=rtl] .pb{text-align:right}
.owner{color:var(--muted);margin:0}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;list-style:none;margin:0;padding:0}
.links a,.links span.lk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;text-decoration:none;min-height:56px}
.links a:hover{border-color:var(--teal);background:var(--teal-soft)}
.links svg.i{color:var(--teal)}
.links small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
body.l-ur .links small{line-height:1.8}
.links .v{font-family:var(--sans);direction:ltr;unicode-bidi:isolate;font-size:.93rem;overflow-wrap:anywhere}
footer{background:var(--ink);color:#93A3BB;text-align:center;font-size:.85rem;font-family:var(--sans);padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom))}

/* guide page */
.ghead{background:var(--ink);color:#fff;padding:clamp(22px,4vw,40px) 0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:#B9C6D8;cursor:pointer;padding:6px 0;margin-bottom:6px}
.back:hover{color:#fff}
[dir=rtl] .back svg{transform:scaleX(-1)}
.ghead-row{display:flex;gap:16px;align-items:center}
.ghead .tile{background:rgba(255,255,255,.08);color:#7FD8C3;width:54px;height:54px}
.ghead h1{margin:0;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.25;font-weight:600}
body.l-ur .ghead h1{line-height:1.9}
.ghead .file{background:rgba(255,255,255,.1);color:#CFE9E2}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:-1px}
.fact{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.fact h3{margin:0 0 6px;font-size:.9rem;color:var(--teal-ink);font-weight:600}
.fact p{margin:0}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:clamp(16px,3vw,26px);margin-top:16px}
.panel h2{margin:0 0 14px;font-size:1.12rem;font-weight:600}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px;list-style:none;margin:0;padding:0;counter-reset:none}
.st{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:12px;padding:8px 12px;font-size:.92rem;line-height:1.45;background:var(--paper);min-height:54px}
body.l-ur .st{line-height:1.9;padding:4px 12px}

.st b{flex:none;width:28px;height:28px;border-radius:999px;display:inline-grid;place-items:center;background:var(--teal);color:#fff;font-size:.75rem;font-family:var(--sans);font-weight:600;padding:0 6px}
.st.c b{background:var(--muted)}

.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--rule)}
.step:first-child{border-top:0;padding-top:4px}
.num{width:36px;height:36px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:600;font-family:var(--sans)}
.step.c .num{background:transparent;color:var(--muted);border:1.5px solid var(--rule)}
.step h3{margin:0;font-size:1.04rem;font-weight:600;line-height:1.5;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
body.l-ur .step h3{line-height:2}
.step p{margin:2px 0 0;color:var(--text)}
.tag{font-size:.72rem;font-weight:400;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:0 8px;line-height:1.8}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(8,13,24,.55);display:none;z-index:60;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:480px;max-height:min(80vh,720px);overflow:auto;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.shead{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule)}
.shead h2{margin:0;font-size:1.05rem;font-weight:600}
.x{width:40px;height:40px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--paper)}
.list{list-style:none;margin:0;padding:8px}
.list button{width:100%;display:flex;align-items:center;gap:12px;text-align:start;border:0;background:transparent;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:52px}
.list button:hover,.list button[aria-current=true]{background:var(--teal-soft)}
.list .tile{width:38px;height:38px}
.list .file{font-size:.72rem;background:none;padding:0;color:var(--muted)}
.list .nm{display:block;font-weight:600;line-height:1.5}
body.l-ur .list .nm{line-height:2}
.list .chk{margin-inline-start:auto;color:var(--teal);visibility:hidden}
.list button[aria-current=true] .chk{visibility:visible}
.list .sd{display:block;font-size:.8rem;color:var(--muted);line-height:1.5}
body.l-ur .list .sd{line-height:1.9}
.lead.skl{margin:16px 0 18px;color:#C9D3E2}
.ghead .ctas a.btn{text-decoration:none}
.tree{list-style:none;margin:0;padding:0}
.tree li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--rule)}
.tree li:first-child{border-top:0}
.tree .td{color:var(--muted);font-size:.92rem}
.lcode{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);display:grid;place-items:center;font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--muted);flex:none}
:focus-visible{outline:3px solid #5FC9B2;outline-offset:2px;border-radius:8px}

.bar .btn .lbl{overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.bar #openGuides{flex:1 1 0;min-width:0}.flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.st{padding:8px 10px;font-size:.88rem}}
@media (max-width:560px){.bar #openKit .lbl{display:none}.bar #openKit{flex:0 0 46px;padding:0}}
@media (max-width:400px){.bar .brand{display:none}}
@media (max-width:420px){.bar #goHome .lbl,.bar #openLang .lbl{display:none}.bar #goHome,.bar #openLang{flex:0 0 46px;padding:0}}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.contact-grid{grid-template-columns:1fr}}
@media (max-width:560px){
 .brand-t{display:none}
 .bar{gap:6px}
 .bar .btn{padding:0 10px;flex:1 1 auto}
 .bar .brand{flex:none}
 .overlay{align-items:flex-end;padding:0}
 .sheet{max-width:none;border-radius:18px 18px 0 0;max-height:85vh;padding-bottom:env(safe-area-inset-bottom)}
 .ctas .btn{flex:1 1 auto;justify-content:center}
 .row{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}
@media print{header,.overlay,.back,.ctas{display:none}.hero,.ghead,footer{background:none;color:#000}}
</style>
</head>

<script id="data" type="application/json">{"en":{"ui":{"title":"Claude Instruction Guides","subtitle":"How each instruction file works, step by step","guides":"Guides","language":"Language","choose":"Choose a guide","homeIntro":"Each instruction file is complete on its own. Attach only the file for your task to the Claude project or chat. Open a guide below to see what it does and the steps Claude follows.","purpose":"What it does","when":"When to use it","attach":"Files to attach","flow":"The whole flow at a glance","steps":"Steps in detail","common":"Same in every file","close":"Close","back":"All guides","rules":"Rules in every file","rulesList":["Every choice is a clickable option","Your approval is needed at every gate","Code is written last, only after you click \"Yes, start coding\"","Secrets never go into chat or code","Every publish needs a fresh confirmation","Claude says \"I can't be sure\" instead of guessing"],"footer":"Powered by FDE Automation Pakistan, Kamran Aziz","heroLead":"This page explains the instruction files Claude reads before a project starts. Each file is a complete rulebook for one kind of work: websites, web and mobile apps, AI agents, automations, finance work, and private AI models. Open a guide to see what the file does, when to use it, and every step Claude follows, from the first question to the final handover.","heroNote":"It works offline on any phone, tablet, or computer, in seven languages.","openList":"Instruction list","howRuns":"How every project runs","poweredBy":"Powered by FDE Automation Pakistan","owner":"Kamran Aziz Virk, Founder & CEO","website":"Website","email":"Email","github":"View on GitHub","linkedin":"LinkedIn","location":"Faisalabad, Pakistan","contact":"Contact","allGuides":"The nine instruction files","home":"Home","kit":"Skill & guides","kitTitle":"What would you like to open?","kitSkill":"Skill","kitSkillD":"Features, download, and setup","kitGuides":"Instructions","kitGuidesD":"The nine instruction guides","skillTitle":"FDE Automation Skill","skillLead":"One Claude skill that holds the whole way we work. Once it is added to Claude, you no longer attach instruction files. Describe the project, and Claude opens only the rules that project needs.","featTitle":"What it does","feats":["Covers all nine kinds of work: apps, websites, single agents, agent teams, workflows, social media, existing projects, finance, and your own LLM","Picks the right workflow from your description, or you can name it directly","Reads only what the project needs, so it stays fast and focused","Keeps every rule: Urdu explanations, clickable choices, approval gates, and code only after approval","Saves progress in PROGRESS.md and DECISIONS.md so work can resume in a new chat","Works in the Claude app, Claude Code, and the Claude API"],"download":"Download the skill (.zip)","openClaude":"Open Claude","installTitle":"Add it to Claude","install":["Download the skill file with the button above.","In the Claude app, open Customize, then Skills.","Upload fde-automation-skill.zip and switch it on. Code execution must be on in your settings.","Start a project by describing it, or say: \"Use the FDE Automation Skill\"."],"codeTitle":"Claude Code","codeText":"Unzip the file and copy the fde-automation-skill folder into ~/.claude/skills/ for all your projects, or into .claude/skills/ inside one project.","insideTitle":"What is inside","insideCore":"Rules that always apply, and the router","insideCommon":"Security, privacy, testing, engineering, AI engineering, and templates"},"common":{"start":[{"h":"Attach one file","t":"Attach only the instruction file for this task to the Claude project or chat. It holds every rule Claude needs."},{"h":"Greeting and project","t":"Claude greets you in simple Urdu and asks what we are building. If you have already said it, Claude only confirms."},{"h":"Project files","t":"Continuing an old project? Attach PROGRESS.md, DECISIONS.md and PROJECT_BRIEF.md. Claude summarises where you stopped and continues from there."},{"h":"Choose the mode","t":"Express Mode for small, low-risk work with shorter steps. Full Mode for bigger work with money, calls, personal data or many users."},{"h":"Intake questions","t":"One clickable question at a time: client region, autonomy level, languages, data sensitivity, existing systems, volume, and budget."},{"h":"Technology and languages","t":"Claude recommends a language set and tools, free first. A paid tool is suggested only with clickable options, and Claude never buys anything."},{"h":"Approve the plan","t":"Claude shows the phases, the approval gates and the skipped phases in Urdu. Work starts only after you click Approved."}],"end":[{"h":"Coding gate","t":"Before any program code, Claude asks: \"Shall we start coding?\" Only a clear \"Yes, start coding\" counts."},{"h":"Build and test","t":"One module at a time. Each module is explained, built, tested and approved before the next one starts."},{"h":"Review and security","t":"Code, security and compliance checklists are run. Every problem found is fixed and tested again."},{"h":"Handover","t":"README, CLAUDE.md, runbook, support terms and a rollback plan are handed over. Progress is saved at every gate."}]},"guides":{"APPS":{"title":"Web App and Mobile App","purpose":"Builds web applications (logins, dashboards, client portals) and mobile apps for Android, iOS or both.","when":"When you need an app with users, screens and data.","attach":"INSTRUCTION-APPS.md. If the app takes payments, also INSTRUCTION-FINANCE.md. If it has an AI chat, also INSTRUCTION-SINGLE-AGENT.md.","steps":[{"h":"Roles and permissions","t":"A table of user types: what each can see and change. Least access by default."},{"h":"Screens and flow","t":"Main screens are designed as previews, with two or three options for the home screen. You choose."},{"h":"Login and security","t":"You approve the login method. Passwords are hashed, sessions expire, and every protected action is checked on the server."},{"h":"Data model","t":"Tables and data flow are explained in simple Urdu. Changes happen only through migrations, with a backup plan."},{"h":"API design","t":"A versioned API described in OpenAPI, with input checks and rate limits."},{"h":"Feature by feature","t":"Only the must-have features in the first release, each in its own branch and tested."},{"h":"Mobile store release","t":"Permissions, privacy labels, signing keys kept safe, internal test, beta, then store release."}]},"WEBSITE":{"title":"Website","purpose":"Builds business sites, landing pages, portfolios, blogs and online shops.","when":"When you need a public website.","attach":"INSTRUCTION-WEBSITE.md. For an online shop with payments, also INSTRUCTION-FINANCE.md.","steps":[{"h":"Pages and content","t":"A sitemap and a content list per page: title, text, button and image descriptions."},{"h":"Design options","t":"Two or three design previews, mobile first. You choose one. Only images you have the right to use."},{"h":"Forms and privacy","t":"Forms are checked on the server, protected from spam, and say clearly what data is collected and why."},{"h":"Online shop","t":"Only if you sell. Prices come from you, payment uses the provider's hosted checkout, and card numbers are never stored."},{"h":"Speed, access and SEO","t":"WCAG 2.2 AA accessibility, Core Web Vitals targets, page titles, sitemap, and Urdu right-to-left support."},{"h":"Hosting and launch","t":"Domain and hosting in the client's own name, a pre-launch check, and a fresh confirmation before publishing."}]},"SINGLE-AGENT":{"title":"Single Automation Agent","purpose":"Builds one AI agent for chat, support, booking, lead qualification, reminders or phone calls.","when":"When one agent with a few tools can do the job.","attach":"INSTRUCTION-SINGLE-AGENT.md. For WhatsApp or social channels, also INSTRUCTION-SOCIAL-MEDIA.md. For money, also INSTRUCTION-FINANCE.md.","steps":[{"h":"Behaviour spec","t":"What the agent may do, what it must never do, when it hands over to a human, and its fallback message."},{"h":"Knowledge sources","t":"Only approved data such as FAQs, prices and policies. If the answer is not there, the agent hands over."},{"h":"Prompt design","t":"Versioned prompts in English with tone, languages, limits, AI disclosure and injection protection."},{"h":"Tools and limits","t":"An approved tool list, least access, a step limit, a daily cost cap and a kill switch."},{"h":"Voice calls","t":"Only for phone agents: call flow, AI disclosure, calling rules, voice choice, and tests with accents and noise."},{"h":"Tests and red teaming","t":"A test set with Urdu, Roman Urdu, rude users and trick questions, scored before every gate."},{"h":"Pilot and go-live","t":"Test account first, a small pilot with a human watching, then a daily summary of chats, hand-offs and cost."}]},"MULTI-AGENT":{"title":"Multi-Agent System","purpose":"Builds a team of AI agents with clear roles that pass work to each other.","when":"When one agent is not enough and the work has several separate roles.","attach":"INSTRUCTION-MULTI-AGENT.md. Add INSTRUCTION-SOCIAL-MEDIA.md or INSTRUCTION-FINANCE.md if channels or money are involved.","steps":[{"h":"Is a team needed?","t":"Claude first checks whether one agent could do it. More agents mean more cost and more points of failure."},{"h":"Agent map","t":"Each agent's role, inputs, outputs and tools, drawn as a diagram for your approval."},{"h":"Orchestration","t":"Who starts, how work is handed over in a fixed message format, and where a human joins."},{"h":"Memory and state","t":"What each agent may read and write, one owner per piece of data, and saved task state for recovery."},{"h":"Failures and limits","t":"Retries, fallbacks, step and cost limits per agent, no endless loops, and one kill switch for the whole team."},{"h":"Build order","t":"Tools first, then single agents, then pairs, then the full team, each tested on its own."},{"h":"Team evaluation","t":"End-to-end tests, traces of every step, and injection tests across the whole chain."}]},"WORKFLOW":{"title":"Workflow Automation","purpose":"Connects apps and data to remove manual work, including email and department automation.","when":"When a repeated manual task should run by itself.","attach":"INSTRUCTION-WORKFLOW.md. If money is involved, also INSTRUCTION-FINANCE.md.","steps":[{"h":"Process map","t":"The current manual process and the automated one, with success measures such as time saved and error rate."},{"h":"Trigger and steps","t":"What starts the flow and each action in order, with the data it reads and writes."},{"h":"Errors and duplicates","t":"Retry, alert or stop on errors. A repeated trigger never creates duplicate records or messages."},{"h":"Email automation","t":"Sorting rules, draft replies, follow-ups that stop on reply, SPF, DKIM, DMARC, and no opening of email links."},{"h":"Department pilot","t":"One department process first, with a human supervisor, then expansion."},{"h":"Test copy and versions","t":"Build in a test copy, export each approved flow to Git, and name an owner for every flow."}]},"SOCIAL-MEDIA":{"title":"Social Media Automation","purpose":"Automates WhatsApp, Instagram, Facebook, LinkedIn and similar platforms through official tools only.","when":"When you want message replies, comment replies, lead capture or updates on social platforms.","attach":"INSTRUCTION-SOCIAL-MEDIA.md. For the answering agent, also INSTRUCTION-SINGLE-AGENT.md or INSTRUCTION-MULTI-AGENT.md.","steps":[{"h":"Platforms and features","t":"You choose the platforms and the features: replies, comments, leads, FAQs, updates or scheduled posts."},{"h":"Official accounts","t":"Official business accounts with admin access and only the permissions the features need. No scrapers or fake accounts."},{"h":"Opt-in and opt-out","t":"Promotional messages only to people who agreed. Opt-out works at once and is logged."},{"h":"Webhook security","t":"Every incoming message is verified, handled once, and treated as untrusted text."},{"h":"Platform rules","t":"WhatsApp templates are approved first. LinkedIn automation is limited. You confirm each platform's current policy."},{"h":"Test, then live","t":"Test account first, then a pilot, then a fresh confirmation for each live channel."}]},"GITHUB-AMEND":{"title":"Amend an Existing Project","purpose":"Checks an existing project (GitHub, client folder or zip), finds faults, fixes them and completes missing parts.","when":"When you receive an incomplete or faulty project to check, fix and finish.","attach":"INSTRUCTION-GITHUB-AMEND.md. If large new parts must be built, also the file for that kind of work (for example APPS or SINGLE-AGENT).","steps":[{"h":"Receive and inspect","t":"Claude lists the files and reads the README, licence and settings. Nothing is run yet."},{"h":"Permission and licence","t":"Do you have the right to change it? The licence is explained, and credit to the original author is kept."},{"h":"Audit, no changes","t":"A report of bugs, security, privacy, speed, tests and documentation, each with file, severity and effect."},{"h":"Choose what to fix","t":"You tick the findings to act on, grouped by severity."},{"h":"Amendment plan","t":"Fixes, additions and deletions, one at a time, each with its own clickable approval."},{"h":"Apply in a new branch","t":"Never on main. One commit per change, existing tests run, secrets scanned in the history."},{"h":"Publish carefully","t":"A privacy and secret check, the original credit and your footer, and a fresh confirmation every time."}]},"FINANCE":{"title":"Finance Automation","purpose":"Automates invoices, payment reminders, reconciliation, expense claims and reports with strict controls.","when":"When any work touches money or finance records.","attach":"INSTRUCTION-FINANCE.md, alone or together with the file of the main work.","steps":[{"h":"Read-only first","t":"Access starts read-only. Each write permission needs its own approval."},{"h":"Process map","t":"Each finance step is marked automated, human-approved or human-only."},{"h":"Approval matrix","t":"Amount limits and approvers, with two people for payments and bank detail changes."},{"h":"Safe money handling","t":"Exact decimals, never floating-point numbers, a currency code on every amount, and keys that prevent duplicates."},{"h":"Reconciliation","t":"Two sources are matched. Differences go to a human and are never forced to match."},{"h":"Sandbox tests","t":"Test mode only, never live payments. Limit tests and audit-trail tests must pass."},{"h":"Security review","t":"A separate security review before any write access. Claude gives no tax or accounting advice."}]},"LLM":{"title":"Your Own LLM","purpose":"Builds your own branded AI model product: choose a base model, train it on your data, serve it, offer an API and MCP, and connect the Claude API.","when":"When you want your own assistant like ChatGPT, Claude or Gemini under your own brand.","attach":"INSTRUCTION-LLM.md. For a full chat app with logins and screens, also INSTRUCTION-APPS.md.","steps":[{"h":"Honest start","t":"A model like ChatGPT from zero costs tens of millions of dollars. The practical way is to build on an existing model."},{"h":"Choose the path","t":"A: brand on Claude API. B: open model on your servers. C: B plus training. D: hybrid router. E: small model from zero."},{"h":"Licences and terms","t":"Base model licence, provider terms, data rights, an original brand name, and customer terms checked by a lawyer."},{"h":"Data preparation","t":"Clean data with personal details removed, checked in Urdu and Roman Urdu, split into train and test sets."},{"h":"Training","t":"Efficient methods such as LoRA, a GPU budget with a hard spending limit, and every run recorded."},{"h":"Evaluation","t":"Fair comparison with Claude on the same tests, red teaming, speed and cost measured, and a model card."},{"h":"Serving, API and MCP","t":"Inference server, streaming, a key per customer, quotas, OpenAPI documents and secure MCP connections."},{"h":"Claude router","t":"Simple or private requests to your model, hard ones to Claude. Private data never leaves, enforced in code."},{"h":"Delivery to customer","t":"Where it runs, who owns the weights, service levels, and a retraining plan."}]}}},"ur":{"ui":{"title":"کلاؤڈ ہدایات کی رہنما","subtitle":"ہر ہدایت نامہ کیسے کام کرتا ہے، قدم بہ قدم","guides":"رہنمائیاں","language":"زبان","choose":"رہنما منتخب کریں","homeIntro":"ہر ہدایت نامہ اپنے آپ میں مکمل ہے۔ اپنے کام کی صرف ایک فائل کلاؤڈ کے پروجیکٹ یا چیٹ کے ساتھ لگائیں۔ نیچے کوئی بھی رہنما کھولیں اور دیکھیں کہ وہ کیا کرتی ہے اور کلاؤڈ کن مراحل سے گزرتا ہے۔","purpose":"یہ کیا کرتی ہے","when":"کب استعمال کریں","attach":"کون سی فائلیں لگائیں","flow":"پورا طریقہ ایک نظر میں","steps":"مراحل کی تفصیل","common":"ہر فائل میں یکساں","close":"بند کریں","back":"تمام رہنمائیاں","rules":"ہر فائل کے بنیادی اصول","rulesList":["ہر انتخاب کلک کرنے والا آپشن ہوگا","ہر چوکی (Gate) پر آپ کی منظوری لازمی ہے","کوڈ سب سے آخر میں، صرف \"Yes, start coding\" دبانے کے بعد","راز (پاس ورڈ، چابیاں) کبھی چیٹ یا کوڈ میں نہیں","ہر اشاعت (Publish) کے لیے ہر بار نئی تصدیق","اندازے کی جگہ کلاؤڈ کہتا ہے \"میں یقین سے نہیں کہہ سکتا\""],"footer":"Powered by FDE Automation Pakistan, Kamran Aziz","heroLead":"یہ صفحہ ان ہدایت فائلوں کو سمجھاتا ہے جو کسی بھی پروجیکٹ سے پہلے کلاؤڈ پڑھتا ہے۔ ہر فائل ایک قسم کے کام کی مکمل اصول کتاب ہے: ویب سائٹ، ویب اور موبائل ایپ، AI ایجنٹ، آٹومیشن، مالیاتی کام اور اپنا AI ماڈل۔ کوئی رہنما کھولیں اور دیکھیں کہ فائل کیا کرتی ہے، کب استعمال ہوتی ہے، اور پہلے سوال سے آخری حوالگی تک کلاؤڈ کون سے مراحل طے کرتا ہے۔","heroNote":"یہ انٹرنیٹ کے بغیر ہر موبائل، ٹیبلٹ اور کمپیوٹر پر سات زبانوں میں کھلتا ہے۔","openList":"ہدایات کی فہرست","howRuns":"ہر پروجیکٹ کیسے چلتا ہے","poweredBy":"Powered by FDE Automation Pakistan","owner":"کامران عزیز ورک، بانی اور CEO","website":"ویب سائٹ","email":"ای میل","github":"GitHub پر دیکھیں","linkedin":"LinkedIn","location":"فیصل آباد، پاکستان","contact":"رابطہ","allGuides":"نو ہدایت فائلیں","home":"ہوم","kit":"Skill اور رہنما","kitTitle":"آپ کیا کھولنا چاہتے ہیں؟","kitSkill":"Skill","kitSkillD":"خصوصیات، ڈاؤن لوڈ اور تنصیب","kitGuides":"ہدایات","kitGuidesD":"نو ہدایت ناموں کی رہنما","skillTitle":"FDE Automation Skill","skillLead":"کلاؤڈ کی ایک Skill جس میں ہمارے کام کا پورا طریقہ موجود ہے۔ اسے کلاؤڈ میں شامل کرنے کے بعد آپ کو ہدایت فائلیں لگانی نہیں پڑتیں۔ بس پروجیکٹ بتائیں، کلاؤڈ صرف وہی اصول کھولے گا جن کی اس پروجیکٹ کو ضرورت ہے۔","featTitle":"یہ کیا کرتی ہے","feats":["نو قسم کے کام: ایپس، ویب سائٹ، ایک ایجنٹ، ایجنٹوں کی ٹیم، ورک فلو، سوشل میڈیا، موجودہ پروجیکٹ، فنانس اور اپنا LLM","آپ کی بات سن کر صحیح طریقہ خود چنتی ہے، یا آپ نام لے کر بتا سکتے ہیں","صرف وہی پڑھتی ہے جس کی ضرورت ہو، اس لیے تیز اور مرکوز رہتی ہے","تمام اصول برقرار: اردو وضاحت، کلک والے آپشن، منظوری کی چوکیاں، اور کوڈ صرف منظوری کے بعد","پیش رفت PROGRESS.md اور DECISIONS.md میں محفوظ، تاکہ نئی چیٹ میں کام وہیں سے چلے","کلاؤڈ ایپ، Claude Code اور Claude API تینوں میں چلتی ہے"],"download":"Skill ڈاؤن لوڈ کریں (.zip)","openClaude":"کلاؤڈ کھولیں","installTitle":"کلاؤڈ میں شامل کرنے کا طریقہ","install":["اوپر والے بٹن سے Skill کی فائل ڈاؤن لوڈ کریں۔","کلاؤڈ ایپ میں Customize کھولیں، پھر Skills۔","fde-automation-skill.zip اپلوڈ کر کے اسے آن کریں۔ سیٹنگز میں Code execution آن ہونا چاہیے۔","پروجیکٹ بتا کر کام شروع کریں، یا لکھیں: \"Use the FDE Automation Skill\"۔"],"codeTitle":"Claude Code","codeText":"فائل کو unzip کریں اور fde-automation-skill فولڈر کو تمام پروجیکٹس کے لیے ~/.claude/skills/ میں، یا کسی ایک پروجیکٹ کے .claude/skills/ میں کاپی کریں۔","insideTitle":"اس کے اندر کیا ہے","insideCore":"ہمیشہ لاگو ہونے والے اصول اور راستہ بتانے والی فہرست","insideCommon":"سکیورٹی، پرائیویسی، ٹیسٹنگ، انجینئرنگ، AI انجینئرنگ اور ٹیمپلیٹس"},"common":{"start":[{"h":"ایک فائل لگائیں","t":"اس کام کی صرف ایک ہدایت فائل کلاؤڈ کے پروجیکٹ یا چیٹ کے ساتھ لگائیں۔ اس میں کلاؤڈ کے سارے اصول موجود ہیں۔"},{"h":"سلام اور پروجیکٹ","t":"کلاؤڈ آسان اردو میں سلام کر کے پوچھتا ہے کہ کیا بنانا ہے۔ اگر آپ پہلے بتا چکے ہوں تو وہ صرف تصدیق کرتا ہے۔"},{"h":"پروجیکٹ کی فائلیں","t":"پرانا کام جاری ہے؟ تو PROGRESS.md، DECISIONS.md اور PROJECT_BRIEF.md لگائیں۔ کلاؤڈ بتائے گا کہ کام کہاں رکا تھا اور وہیں سے آگے چلے گا۔"},{"h":"طریقہ منتخب کریں","t":"چھوٹے اور کم خطرے والے کام کے لیے Express Mode (مختصر طریقہ)، اور پیسوں، کالز، ذاتی ڈیٹا یا زیادہ صارفین والے بڑے کام کے لیے Full Mode (مکمل طریقہ)۔"},{"h":"ابتدائی سوالات","t":"ایک وقت میں ایک کلک والا سوال: گاہک کا علاقہ، خود مختاری کی حد، زبانیں، ڈیٹا کی حساسیت، موجودہ سسٹم، حجم اور بجٹ۔"},{"h":"ٹیکنالوجی اور زبانیں","t":"کلاؤڈ پروگرامنگ زبانوں کا تجویز کردہ سیٹ اور ٹولز بتاتا ہے، پہلے مفت۔ پیڈ ٹول صرف کلک والے آپشن کے ساتھ پیش ہوتا ہے، اور کلاؤڈ خود کچھ نہیں خریدتا۔"},{"h":"منصوبے کی منظوری","t":"کلاؤڈ اردو میں مراحل، منظوری کی چوکیاں اور چھوڑے گئے مراحل دکھاتا ہے۔ کام آپ کے Approved دبانے کے بعد ہی شروع ہوتا ہے۔"}],"end":[{"h":"کوڈ کی اجازت","t":"کوئی بھی پروگرام کوڈ لکھنے سے پہلے کلاؤڈ پوچھتا ہے: \"کیا اب ہم کوڈ شروع کریں؟\" صرف واضح \"Yes, start coding\" ہی منظوری مانی جاتی ہے۔"},{"h":"بنانا اور جانچنا","t":"ایک وقت میں ایک حصہ۔ ہر حصہ پہلے سمجھایا جاتا ہے، پھر بنایا، جانچا اور منظور کیا جاتا ہے، اس کے بعد اگلا۔"},{"h":"جائزہ اور سکیورٹی","t":"کوڈ، سکیورٹی اور قوانین کی جانچ کی فہرستیں چلائی جاتی ہیں۔ ہر خرابی ٹھیک کر کے دوبارہ جانچی جاتی ہے۔"},{"h":"حوالگی","t":"README، CLAUDE.md، چلانے کی ہدایات، سپورٹ کی شرائط اور واپسی کا منصوبہ (Rollback) حوالے کیے جاتے ہیں۔ ہر چوکی پر کام محفوظ ہوتا ہے۔"}]},"guides":{"APPS":{"title":"ویب ایپ اور موبائل ایپ","purpose":"ویب ایپلیکیشن (لاگ اِن، ڈیش بورڈ، گاہکوں کا پورٹل) اور اینڈرائیڈ، آئی فون یا دونوں کے لیے موبائل ایپ بناتی ہے۔","when":"جب آپ کو صارفین، اسکرینوں اور ڈیٹا والی ایپ چاہیے۔","attach":"INSTRUCTION-APPS.md۔ اگر ایپ میں ادائیگی ہو تو ساتھ INSTRUCTION-FINANCE.md۔ اگر اس میں AI چیٹ ہو تو ساتھ INSTRUCTION-SINGLE-AGENT.md۔","steps":[{"h":"صارفین اور اجازتیں","t":"صارفین کی اقسام کی ایک جدول: ہر ایک کیا دیکھ سکتا ہے اور کیا بدل سکتا ہے۔ شروع میں کم سے کم اجازت۔"},{"h":"اسکرینیں اور ترتیب","t":"اہم اسکرینوں کے نمونے بنتے ہیں، اور ہوم اسکرین کے دو یا تین آپشن۔ آپ منتخب کرتے ہیں۔"},{"h":"لاگ اِن اور سکیورٹی","t":"لاگ اِن کا طریقہ آپ منظور کرتے ہیں۔ پاس ورڈ محفوظ شکل میں رکھے جاتے ہیں، سیشن ختم ہوتے ہیں، اور ہر محفوظ کام کی جانچ سرور پر ہوتی ہے۔"},{"h":"ڈیٹا کا ڈھانچہ","t":"جدولیں اور ڈیٹا کا بہاؤ آسان اردو میں سمجھایا جاتا ہے۔ تبدیلی صرف Migration کے ذریعے، اور بیک اپ کا منصوبہ ساتھ۔"},{"h":"API کا ڈیزائن","t":"ورژن والی API، جو OpenAPI میں لکھی جاتی ہے، ان پٹ کی جانچ اور درخواستوں کی حد کے ساتھ۔"},{"h":"ایک ایک خصوصیت","t":"پہلی ریلیز میں صرف ضروری خصوصیات، ہر ایک الگ برانچ میں اور جانچ کے ساتھ۔"},{"h":"موبائل اسٹور پر ریلیز","t":"اجازتیں، پرائیویسی کی معلومات، سائننگ کی چابیوں کی حفاظت، اندرونی ٹیسٹ، بیٹا، پھر اسٹور پر ریلیز۔"}]},"WEBSITE":{"title":"ویب سائٹ","purpose":"کاروباری ویب سائٹ، لینڈنگ پیج، پورٹ فولیو، بلاگ اور آن لائن دکان بناتی ہے۔","when":"جب آپ کو عوام کے لیے ویب سائٹ چاہیے۔","attach":"INSTRUCTION-WEBSITE.md۔ ادائیگی والی آن لائن دکان کے لیے ساتھ INSTRUCTION-FINANCE.md۔","steps":[{"h":"صفحات اور مواد","t":"صفحات کا نقشہ اور ہر صفحے کے مواد کی فہرست: عنوان، متن، بٹن اور تصویروں کی وضاحت۔"},{"h":"ڈیزائن کے آپشن","t":"دو یا تین ڈیزائن کے نمونے، پہلے موبائل کو دیکھ کر۔ آپ ایک منتخب کرتے ہیں۔ صرف وہی تصویریں جن کا حق آپ کے پاس ہو۔"},{"h":"فارم اور پرائیویسی","t":"فارم کی جانچ سرور پر ہوتی ہے، اسپیم سے حفاظت ہوتی ہے، اور صاف بتایا جاتا ہے کہ کون سا ڈیٹا کیوں لیا جا رہا ہے۔"},{"h":"آن لائن دکان","t":"صرف اگر آپ کچھ بیچتے ہیں۔ قیمتیں آپ دیتے ہیں، ادائیگی کمپنی کے اپنے صفحے سے ہوتی ہے، اور کارڈ نمبر کبھی محفوظ نہیں کیے جاتے۔"},{"h":"رفتار، رسائی اور SEO","t":"WCAG 2.2 AA (رسائی کا معیار)، Core Web Vitals (رفتار کے ہدف)، صفحات کے عنوان، سائٹ میپ اور اردو کے لیے دائیں سے بائیں ترتیب۔"},{"h":"ہوسٹنگ اور لانچ","t":"ڈومین اور ہوسٹنگ گاہک کے اپنے نام پر، لانچ سے پہلے جانچ، اور اشاعت سے پہلے نئی تصدیق۔"}]},"SINGLE-AGENT":{"title":"ایک آٹومیشن ایجنٹ","purpose":"چیٹ، سپورٹ، بکنگ، گاہک کی جانچ، یاد دہانی یا فون کال کے لیے ایک AI ایجنٹ بناتی ہے۔","when":"جب چند ٹولز والا ایک ایجنٹ کام کر سکے۔","attach":"INSTRUCTION-SINGLE-AGENT.md۔ واٹس ایپ یا سوشل میڈیا کے لیے ساتھ INSTRUCTION-SOCIAL-MEDIA.md۔ پیسوں والے کام کے لیے ساتھ INSTRUCTION-FINANCE.md۔","steps":[{"h":"رویے کی تفصیل","t":"ایجنٹ کیا کر سکتا ہے، کیا کبھی نہیں کرے گا، کب انسان کو بات سونپے گا، اور ناکامی پر کیا پیغام دے گا۔"},{"h":"معلومات کے ذرائع","t":"صرف منظور شدہ ڈیٹا، جیسے عام سوالات، قیمتیں اور پالیسیاں۔ جواب وہاں نہ ہو تو ایجنٹ انسان کو بات سونپ دیتا ہے۔"},{"h":"Prompt کی تیاری","t":"انگریزی میں ورژن والے Prompt، جن میں لہجہ، زبانیں، حدیں، AI ہونے کا اعلان اور دھوکے سے حفاظت شامل ہے۔"},{"h":"ٹولز اور حدیں","t":"منظور شدہ ٹولز کی فہرست، کم سے کم اجازت، قدموں کی حد، روزانہ خرچ کی حد اور فوراً روکنے کا بٹن۔"},{"h":"آواز والی کال","t":"صرف فون ایجنٹ کے لیے: کال کی ترتیب، AI ہونے کا اعلان، کال کے قواعد، آواز کا انتخاب، اور مختلف لہجوں اور شور میں جانچ۔"},{"h":"جانچ اور Red Teaming","t":"اردو، رومن اردو، بدتمیز صارفین اور چالاک سوالات والا ٹیسٹ سیٹ، جس کے نمبر ہر چوکی سے پہلے دیکھے جاتے ہیں۔"},{"h":"آزمائش اور آغاز","t":"پہلے ٹیسٹ اکاؤنٹ، پھر انسان کی نگرانی میں چھوٹی آزمائش، پھر چیٹس، حوالگیوں اور خرچ کی روزانہ رپورٹ۔"}]},"MULTI-AGENT":{"title":"ایجنٹوں کی ٹیم","purpose":"AI ایجنٹوں کی ایک ٹیم بناتی ہے جس میں ہر ایک کا کردار واضح ہوتا ہے اور وہ کام ایک دوسرے کو سونپتے ہیں۔","when":"جب ایک ایجنٹ کافی نہ ہو اور کام کے کئی الگ کردار ہوں۔","attach":"INSTRUCTION-MULTI-AGENT.md۔ چینل یا پیسوں کا کام ہو تو ساتھ INSTRUCTION-SOCIAL-MEDIA.md یا INSTRUCTION-FINANCE.md۔","steps":[{"h":"کیا ٹیم ضروری ہے؟","t":"کلاؤڈ پہلے دیکھتا ہے کہ کیا ایک ایجنٹ یہ کام کر سکتا ہے۔ زیادہ ایجنٹ یعنی زیادہ خرچ اور زیادہ خرابی کے مقامات۔"},{"h":"ایجنٹوں کا نقشہ","t":"ہر ایجنٹ کا کردار، ان پٹ، آؤٹ پٹ اور ٹولز، ایک خاکے کی صورت میں آپ کی منظوری کے لیے۔"},{"h":"کام کی تقسیم","t":"کون شروع کرے گا، کام کس مقررہ پیغام کی شکل میں آگے جائے گا، اور انسان کہاں شامل ہوگا۔"},{"h":"یادداشت اور حالت","t":"ہر ایجنٹ کیا پڑھ اور لکھ سکتا ہے، ہر ڈیٹا کا ایک مالک، اور کام کی محفوظ حالت تاکہ خرابی کے بعد دوبارہ چل سکے۔"},{"h":"ناکامی اور حدیں","t":"دوبارہ کوشش، متبادل، ہر ایجنٹ کے قدموں اور خرچ کی حد، کوئی نہ ختم ہونے والا چکر نہیں، اور پوری ٹیم کے لیے ایک روکنے کا بٹن۔"},{"h":"بنانے کی ترتیب","t":"پہلے ٹولز، پھر اکیلے ایجنٹ، پھر جوڑے، پھر پوری ٹیم، ہر ایک الگ جانچ کے ساتھ۔"},{"h":"ٹیم کی جانچ","t":"شروع سے آخر تک کے ٹیسٹ، ہر قدم کا ریکارڈ، اور پوری زنجیر میں دھوکے (Injection) کے ٹیسٹ۔"}]},"WORKFLOW":{"title":"ورک فلو آٹومیشن","purpose":"ایپس اور ڈیٹا کو جوڑ کر ہاتھ کا کام ختم کرتی ہے، ای میل اور شعبوں کی آٹومیشن سمیت۔","when":"جب کوئی بار بار کا کام خود بخود ہونا چاہیے۔","attach":"INSTRUCTION-WORKFLOW.md۔ پیسوں کا کام ہو تو ساتھ INSTRUCTION-FINANCE.md۔","steps":[{"h":"کام کا نقشہ","t":"موجودہ ہاتھ کا طریقہ اور خودکار طریقہ، کامیابی کے پیمانوں کے ساتھ، جیسے بچایا گیا وقت اور غلطیوں کی شرح۔"},{"h":"آغاز اور مراحل","t":"کام کس چیز سے شروع ہوگا، اور ہر قدم ترتیب سے، اس ڈیٹا کے ساتھ جو وہ پڑھتا اور لکھتا ہے۔"},{"h":"غلطیاں اور دہراؤ","t":"غلطی پر دوبارہ کوشش، اطلاع یا رکنا۔ ایک ہی چیز دوبارہ آئے تو بھی ریکارڈ یا پیغام دو بار نہیں بنتا۔"},{"h":"ای میل آٹومیشن","t":"ترتیب کے اصول، جواب کے مسودے، جواب آنے پر رکنے والی یاد دہانیاں، SPF، DKIM، DMARC، اور ای میل کے لنک نہ کھولنا۔"},{"h":"شعبے میں آزمائش","t":"پہلے کسی ایک شعبے کا ایک کام، انسان کی نگرانی میں، پھر آگے پھیلاؤ۔"},{"h":"ٹیسٹ کاپی اور ورژن","t":"کام ٹیسٹ کاپی میں بنتا ہے، ہر منظور شدہ ورک فلو Git میں محفوظ ہوتا ہے، اور ہر ورک فلو کا ایک ذمہ دار ہوتا ہے۔"}]},"SOCIAL-MEDIA":{"title":"سوشل میڈیا آٹومیشن","purpose":"واٹس ایپ، انسٹاگرام، فیس بک، لنکڈ اِن اور ایسے پلیٹ فارمز کو صرف سرکاری ٹولز سے خودکار بناتی ہے۔","when":"جب آپ کو پیغامات اور کمنٹس کے جواب، گاہکوں کی معلومات یا اپڈیٹس خودکار چاہئیں۔","attach":"INSTRUCTION-SOCIAL-MEDIA.md۔ جواب دینے والے ایجنٹ کے لیے ساتھ INSTRUCTION-SINGLE-AGENT.md یا INSTRUCTION-MULTI-AGENT.md۔","steps":[{"h":"پلیٹ فارم اور خصوصیات","t":"آپ پلیٹ فارم اور خصوصیات چنتے ہیں: جواب، کمنٹس، گاہکوں کی معلومات، عام سوالات، اپڈیٹس یا شیڈول پوسٹیں۔"},{"h":"سرکاری اکاؤنٹ","t":"ایڈمن رسائی والے سرکاری بزنس اکاؤنٹ، اور صرف ضروری اجازتیں۔ کوئی جعلی اکاؤنٹ یا ڈیٹا چرانے والے ٹول نہیں۔"},{"h":"رضامندی اور انکار","t":"تشہیری پیغام صرف ان کو جنہوں نے اجازت دی ہو۔ انکار فوراً نافذ ہوتا ہے اور ریکارڈ ہوتا ہے۔"},{"h":"Webhook کی حفاظت","t":"ہر آنے والا پیغام جانچا جاتا ہے، ایک ہی بار سنبھالا جاتا ہے، اور اسے ناقابلِ اعتبار متن سمجھا جاتا ہے۔"},{"h":"پلیٹ فارم کے قواعد","t":"واٹس ایپ کے ٹیمپلیٹ پہلے منظور ہوتے ہیں۔ لنکڈ اِن پر آٹومیشن محدود ہے۔ ہر پلیٹ فارم کی موجودہ پالیسی کی تصدیق آپ کرتے ہیں۔"},{"h":"پہلے ٹیسٹ، پھر لائیو","t":"پہلے ٹیسٹ اکاؤنٹ، پھر آزمائش، پھر ہر لائیو چینل کے لیے نئی تصدیق۔"}]},"GITHUB-AMEND":{"title":"موجودہ پروجیکٹ کی درستی","purpose":"پہلے سے موجود پروجیکٹ (GitHub، گاہک کا فولڈر یا زِپ فائل) کی جانچ کرتی ہے، خرابیاں ڈھونڈ کر ٹھیک کرتی ہے اور نامکمل حصے مکمل کرتی ہے۔","when":"جب آپ کو کوئی نامکمل یا خراب پروجیکٹ جانچنے، درست کرنے اور مکمل کرنے کے لیے ملے۔","attach":"INSTRUCTION-GITHUB-AMEND.md۔ اگر بڑے نئے حصے بنانے ہوں تو ساتھ اس کام کی فائل بھی، مثلاً APPS یا SINGLE-AGENT۔","steps":[{"h":"وصولی اور معائنہ","t":"کلاؤڈ فائلوں کی فہرست بناتا ہے اور README، لائسنس اور سیٹنگز پڑھتا ہے۔ ابھی کچھ چلایا نہیں جاتا۔"},{"h":"اجازت اور لائسنس","t":"کیا آپ کو اسے بدلنے کا حق ہے؟ لائسنس سمجھایا جاتا ہے، اور اصل مصنف کا حوالہ برقرار رہتا ہے۔"},{"h":"جانچ، بغیر تبدیلی","t":"بگ، سکیورٹی، پرائیویسی، رفتار، ٹیسٹ اور دستاویزات کی رپورٹ، ہر خرابی کی فائل، شدت اور اثر کے ساتھ۔"},{"h":"کیا ٹھیک کرنا ہے","t":"آپ شدت کے حساب سے گروپ کی گئی خرابیوں میں سے وہ منتخب کرتے ہیں جن پر کام ہونا ہے۔"},{"h":"درستی کا منصوبہ","t":"درستیاں، اضافے اور حذف، ایک ایک کر کے، ہر ایک کی الگ کلک والی منظوری کے ساتھ۔"},{"h":"نئی برانچ میں کام","t":"کبھی main پر نہیں۔ ہر تبدیلی کا الگ Commit، موجودہ ٹیسٹ چلتے ہیں، اور پرانی تاریخ میں رازوں کی تلاش ہوتی ہے۔"},{"h":"احتیاط سے اشاعت","t":"پرائیویسی اور رازوں کی جانچ، اصل مصنف کا حوالہ اور آپ کا فوٹر، اور ہر بار نئی تصدیق۔"}]},"FINANCE":{"title":"مالیاتی آٹومیشن","purpose":"انوائس، ادائیگی کی یاد دہان ة البسيطة ويسأل عمّا سنبنيه. إذا كنت قد ذكرته مسبقاً، يكتفي بالتأكيد."},{"h":"ملفات المشروع","t":"هل تكمل مشروعاً قديماً؟ أرفق PROGRESS.md وDECISIONS.md وPROJECT_BRIEF.md. يلخص Claude أين توقفت ويكمل من هناك."},{"h":"اختر الوضع","t":"الوضع السريع (Express) للأعمال الصغيرة منخفضة المخاطر بخطوات أقصر، والوضع الكامل (Full) للأعمال الأكبر التي تشمل المال أو المكالمات أو البيانات الشخصية أو كثيراً من المستخدمين."},{"h":"أسئلة البداية","t":"سؤال واحد قابل للنقر في كل مرة: منطقة العميل، مستوى الاستقلالية، اللغات، حساسية البيانات، الأنظمة الحالية، الحجم والميزانية."},{"h":"التقنية واللغات","t":"يقترح Claude مجموعة لغات برمجة وأدوات، المجانية أولاً. الأداة المدفوعة تُعرض فقط بخيارات قابلة للنقر، ولا يشتري Claude أي شيء."},{"h":"اعتماد الخطة","t":"يعرض Claude المراحل وبوابات الموافقة والمراحل المتخطاة. يبدأ العمل فقط بعد نقرك على Approved."}],"end":[{"h":"بوابة البرمجة","t":"قبل أي شيفرة برمجية يسأل Claude: \"هل نبدأ البرمجة الآن؟\" ولا يُحتسب إلا \"Yes, start coding\" بشكل واضح."},{"h":"البناء والاختبار","t":"وحدة واحدة في كل مرة. تُشرح كل وحدة وتُبنى وتُختبر وتُعتمد قبل البدء في التالية."},{"h":"المراجعة والأمان","t":"تُطبق قوائم فحص الشيفرة والأمان والامتثال. كل مشكلة تُصلح ثم تُختبر من جديد."},{"h":"التسليم","t":"يُسلَّم README وCLAUDE.md ودليل التشغيل وشروط الدعم وخطة التراجع. ويُحفظ التقدم عند كل بوابة."}]},"guides":{"APPS":{"title":"تطبيق ويب وتطبيق جوال","purpose":"يبني تطبيقات ويب (تسجيل دخول، لوحات تحكم، بوابات عملاء) وتطبيقات جوال لأندرويد أو iOS أو كليهما.","when":"عندما تحتاج تطبيقاً فيه مستخدمون وشاشات وبيانات.","attach":"INSTRUCTION-APPS.md. إذا كان التطبيق يستقبل مدفوعات فأضف INSTRUCTION-FINANCE.md. وإذا كان فيه محادثة ذكاء اصطناعي فأضف INSTRUCTION-SINGLE-AGENT.md.","steps":[{"h":"الأدوار والصلاحيات","t":"جدول بأنواع المستخدمين: ما يراه كل منهم وما يمكنه تغييره. أقل صلاحية ممكنة افتراضياً."},{"h":"الشاشات والتنقل","t":"تُصمم الشاشات الرئيسية كنماذج معاينة، مع خيارين أو ثلاثة للشاشة الرئيسية. أنت تختار."},{"h":"الدخول والأمان","t":"أنت تعتمد طريقة الدخول. كلمات المرور مشفرة، والجلسات تنتهي، وكل عملية محمية تُفحص على الخادم."},{"h":"نموذج البيانات","t":"تُشرح الجداول وتدفق البيانات بلغة بسيطة. التغييرات عبر الترحيلات (Migrations) فقط، مع خطة نسخ احتياطي."},{"h":"تصميم الواجهة البرمجية","t":"واجهة API بإصدارات موصوفة بمعيار OpenAPI، مع فحص المدخلات وحدود للطلبات."},{"h":"ميزة بعد ميزة","t":"الميزات الضرورية فقط في الإصدار الأول، كل منها في فرع مستقل ومختبرة."},{"h":"النشر في المتجر","t":"الأذونات، بيانات الخصوصية، حفظ مفاتيح التوقيع بأمان، اختبار داخلي، نسخة تجريبية، ثم النشر في المتجر."}]},"WEBSITE":{"title":"موقع إلكتروني","purpose":"يبني مواقع الشركات وصفحات الهبوط والملفات التعريفية والمدونات والمتاجر الإلكترونية.","when":"عندما تحتاج موقعاً عاماً على الإنترنت.","attach":"INSTRUCTION-WEBSITE.md. للمتجر الإلكتروني مع الدفع أضف INSTRUCTION-FINANCE.md.","steps":[{"h":"الصفحات والمحتوى","t":"خريطة الموقع وقائمة محتوى لكل صفحة: العنوان والنص والزر ووصف الصور."},{"h":"خيارات التصميم","t":"نموذجان أو ثلاثة للتصميم، بدءاً من الجوال. أنت تختار واحداً. فقط الصور التي تملك حق استخدامها."},{"h":"النماذج والخصوصية","t":"تُفحص النماذج على الخادم، وتُحمى من الرسائل المزعجة، وتوضح أي بيانات تُجمع ولماذا."},{"h":"المتجر الإلكتروني","t":"فقط إذا كنت تبيع. الأسعار منك، والدفع عبر صفحة الدفع الخاصة بالمزوّد، ولا تُحفظ أرقام البطاقات أبداً."},{"h":"السرعة والوصول وتحسين البحث","t":"إتاحة وفق WCAG 2.2 AA، وأهداف Core Web Vitals، وعناوين الصفحات، وخريطة الموقع، ودعم الاتجاه من اليمين إلى اليسار."},{"h":"الاستضافة والإطلاق","t":"النطاق والاستضافة باسم العميل نفسه، وفحص قبل الإطلاق، وتأكيد جديد قبل النشر."}]},"SINGLE-AGENT":{"title":"وكيل أتمتة واحد","purpose":"يبني وكيل ذكاء اصطناعي واحداً للمحادثة أو الدعم أو الحجز أو تأهيل العملاء أو التذكير أو المكالمات الهاتفية.","when":"عندما يكفي وكيل واحد ببضع أدوات لإنجاز العمل.","attach":"INSTRUCTION-SINGLE-AGENT.md. لواتساب أو قنوات التواصل أضف INSTRUCTION-SOCIAL-MEDIA.md. وللأعمال المالية أضف INSTRUCTION-FINANCE.md.","steps":[{"h":"مواصفات السلوك","t":"ما يُسمح للوكيل به، وما لا يفعله أبداً، ومتى يحوّل إلى إنسان، ورسالته الاحتياطية."},{"h":"مصادر المعرفة","t":"بيانات معتمدة فقط مثل الأسئلة الشائعة والأسعار والسياسات. إذا لم يوجد الجواب، يحوّل الوكيل إلى إنسان."},{"h":"تصميم الأوامر","t":"أوامر (Prompts) بإصدارات باللغة الإنجليزية تتضمن النبرة واللغات والحدود والإفصاح عن كونه ذكاءً اصطناعياً والحماية من الحقن."},{"h":"الأدوات والحدود","t":"قائمة أدوات معتمدة، أقل صلاحية، حد للخطوات، سقف يومي للتكلفة، وزر إيقاف فوري."},{"h":"المكالمات الصوتية","t":"لوكلاء الهاتف فقط: مسار المكالمة، الإفصاح، قواعد الاتصال، اختيار الصوت، واختبارات بلهجات وضوضاء مختلفة."},{"h":"الاختبارات والهجوم التجريبي","t":"مجموعة اختبار بالأردية والأردية الرومانية ومستخدمين فظّين وأسئلة خادعة، تُقيَّم قبل كل بوابة."},{"h":"التجربة والإطلاق","t":"حساب تجريبي أولاً، ثم تجربة صغيرة بإشراف بشري، ثم ملخص يومي للمحادثات والتحويلات والتكلفة."}]},"MULTI-AGENT":{"title":"نظام متعدد الوكلاء","purpose":"يبني فريقاً من وكلاء الذكاء الاصطناعي بأدوار واضحة يمررون العمل لبعضهم.","when":"عندما لا يكفي وكيل واحد ويتضمن العمل عدة أدوار منفصلة.","attach":"INSTRUCTION-MULTI-AGENT.md. أضف INSTRUCTION-SOCIAL-MEDIA.md أو INSTRUCTION-FINANCE.md إذا وُجدت قنوات أو أموال.","steps":[{"h":"هل نحتاج فريقاً؟","t":"يتحقق Claude أولاً هل يكفي وكيل واحد. المزيد من الوكلاء يعني تكلفة أكبر ونقاط فشل أكثر."},{"h":"خريطة الوكلاء","t":"دور كل وكيل ومدخلاته ومخرجاته وأدواته، مرسومة كمخطط لاعتمادك."},{"h":"التنسيق","t":"من يبدأ، وكيف يُسلَّم العمل بصيغة رسالة ثابتة، وأين يتدخل الإنسان."},{"h":"الذاكرة والحالة","t":"ما يقرؤه ويكتبه كل وكيل، ومالك واحد لكل بيانات، وحفظ حالة المهمة للاستعادة."},{"h":"الأعطال والحدود","t":"إعادة المحاولة، البدائل، حدود الخطوات والتكلفة لكل وكيل، لا حلقات لا نهائية، وزر إيقاف واحد للفريق كله."},{"h":"ترتيب البناء","t":"الأدوات أولاً، ثم الوكلاء منفردين، ثم أزواجاً، ثم الفريق كاملاً، مع اختبار كل منها."},{"h":"تقييم الفريق","t":"اختبارات من البداية للنهاية، وتتبع كل خطوة، واختبارات الحقن عبر السلسلة كلها."}]},"WORKFLOW":{"title":"أتمتة سير العمل","purpose":"يربط التطبيقات والبيانات لإلغاء العمل اليدوي، بما في ذلك أتمتة البريد الإلكتروني والأقسام.","when":"عندما ينبغي أن تعمل مهمة يدوية متكررة تلقائياً.","attach":"INSTRUCTION-WORKFLOW.md. إذا وُجد مال فأضف INSTRUCTION-FINANCE.md.","steps":[{"h":"خريطة العملية","t":"العملية اليدوية الحالية والعملية المؤتمتة، مع مقاييس النجاح مثل الوقت الموفر ونسبة الأخطاء."},{"h":"المُشغِّل والخطوات","t":"ما الذي يبدأ السير، وكل إجراء بالترتيب، مع البيانات التي يقرؤها ويكتبها."},{"h":"الأخطاء والتكرار","t":"إعادة محاولة أو تنبيه أو توقف عند الخطأ. ولا يُنشئ المُشغِّل المتكرر سجلات أو رسائل مكررة أبداً."},{"h":"أتمتة البريد","t":"قواعد الفرز، مسودات الردود، متابعات تتوقف عند الرد، SPF وDKIM وDMARC، وعدم فتح روابط الرسائل."},{"h":"تجربة في قسم","t":"عملية واحدة في قسم واحد أولاً بإشراف بشري، ثم التوسع."},{"h":"نسخة اختبار وإصدارات","t":"البناء في نسخة اختبار، وتصدير كل سير معتمد إلى Git، وتحديد مسؤول لكل سير."}]},"SOCIAL-MEDIA":{"title":"أتمتة وسائل التواصل","purpose":"يؤتمت واتساب وإنستغرام وفيسبوك ولينكدإن ومنصات مشابهة عبر الأدوات الرسمية فقط.","when":"عندما تريد ردوداً على الرسائل والتعليقات أو جمع العملاء المحتملين أو التحديثات.","attach":"INSTRUCTION-SOCIAL-MEDIA.md. للوكيل الذي يرد أضف INSTRUCTION-SINGLE-AGENT.md أو INSTRUCTION-MULTI-AGENT.md.","steps":[{"h":"المنصات والميزات","t":"تختار المنصات والميزات: الردود، التعليقات، العملاء المحتملون، الأسئلة الشائعة، التحديثات أو المنشورات المجدولة."},{"h":"الحسابات الرسمية","t":"حسابات أعمال رسمية بصلاحية مدير، والأذونات اللازمة فقط. لا أدوات كشط ولا حسابات وهمية."},{"h":"الاشتراك وإلغاؤه","t":"الرسائل الترويجية فقط لمن وافق. وإلغاء الاشتراك يُنفذ فوراً ويُسجَّل."},{"h":"أمان Webhook","t":"كل رسالة واردة يُتحقق منها وتُعالج مرة واحدة وتُعامل كنص غير موثوق."},{"h":"قواعد المنصات","t":"قوالب واتساب تُعتمد أولاً. الأتمتة في لينكدإن محدودة. وأنت تؤكد السياسة الحالية لكل منصة."},{"h":"اختبار ثم تشغيل","t":"حساب تجريبي أولاً، ثم تجربة، ثم تأكيد جديد لكل قناة تعمل فعلياً."}]},"GITHUB-AMEND":{"title":"تعديل مشروع قائم","purpose":"يفحص مشروعاً قائماً (GitHub أو مجلد عميل أو ملف مضغوط)، ويكتشف الأخطاء ويصلحها ويكمل الأجزاء الناقصة.","when":"عندما تتسلم مشروعاً ناقصاً أو معيباً لفحصه وإصلاحه وإكماله.","attach":"INSTRUCTION-GITHUB-AMEND.md. وإذا لزم بناء أجزاء جديدة كبيرة فأضف ملف ذلك النوع من العمل (مثل APPS أو SINGLE-AGENT).","steps":[{"h":"الاستلام والمعاينة","t":"يسرد Claude الملفات ويقرأ README والترخيص والإعدادات. لا يُشغَّل شيء بعد."},{"h":"الإذن والترخيص","t":"هل لديك حق التعديل؟ يُشرح الترخيص، ويُحفظ الإسناد للمؤلف الأصلي."},{"h":"تدقيق بلا تغيير","t":"تقرير بالأخطاء والأمان والخصوصية والسرعة والاختبارات والتوثيق، مع الملف والخطورة والأثر لكل بند."},{"h":"اختيار ما يُصلح","t":"تحدد البنود التي سيُعمل عليها، مجمّعة حسب الخطورة."},{"h":"خطة التعديل","t":"الإصلاحات والإضافات والحذوفات، واحداً تلو الآخر، لكل منها موافقة مستقلة بالنقر."},{"h":"التطبيق في فرع جديد","t":"ليس على main أبداً. التزام (Commit) لكل تغيير، وتشغيل الاختبارات الحالية، وفحص السجل بحثاً عن الأسرار."},{"h":"النشر بحذر","t":"فحص الخصوصية والأسرار، وإسناد المؤلف الأصلي وتذييلك، وتأكيد جديد في كل مرة."}]},"FINANCE":{"title":"الأتمتة المالية","purpose":"يؤتمت الفواتير وتذكيرات الدفع والتسويات ومطالبات المصروفات والتقارير بضوابط صارمة.","when":"عندما يلمس أي عمل المال أو السجلات المالية.","attach":"INSTRUCTION-FINANCE.md، منفرداً أو مع ملف العمل الرئيسي.","steps":[{"h":"القراءة فقط أولاً","t":"يبدأ الوصول بالقراءة فقط. وكل صلاحية كتابة تحتاج موافقة مستقلة."},{"h":"خريطة العملية","t":"كل خطوة مالية تُصنف: مؤتمتة، أو بموافقة بشرية، أو بشرية فقط."},{"h":"مصفوفة الموافقات","t":"حدود المبالغ والمعتمدون، مع شخصين للمدفوعات وتغيير بيانات البنك."},{"h":"التعامل الآمن مع المال","t":"أرقام عشرية دقيقة لا أرقام عائمة، ورمز عملة مع كل مبلغ، ومفاتيح تمنع التكرار."},{"h":"التسوية","t":"مطابقة مصدرين. الفروق تذهب إلى إنسان ولا تُفرض المطابقة أبداً."},{"h":"اختبارات البيئة التجريبية","t":"وضع الاختبار فقط، لا مدفوعات حقيقية. ويجب نجاح اختبارات الحدود وسجل التدقيق."},{"h":"مراجعة أمنية","t":"مراجعة أمنية منفصلة قبل أي صلاحية كتابة. ولا يقدم Claude نصائح ضريبية أو محاسبية."}]},"LLM":{"title":"نموذجك اللغوي
